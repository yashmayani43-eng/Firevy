<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Light Blue Glow Shape -->
  <ellipse cx="300" cy="220" rx="240" ry="140" fill="url(#bgGrad)" />

  <!-- Floating Gear Icons in Background -->
  <g fill="none" stroke="#0284c7" stroke-width="3" opacity="0.35">
    <!-- Big Gear Top Center -->
    <g transform="translate(390, 80) scale(0.9)">
      <circle cx="20" cy="20" r="16" />
      <circle cx="20" cy="20" r="7" fill="#0284c7" opacity="0.2"/>
      <path d="M20 0v8M20 32v8M0 20h8M32 20h8M6 6l6 6M28 28l6 6M6 34l6-6M28 12l6-6" stroke-linecap="round"/>
    </g>
    <!-- Medium Gear Top Right -->
    <g transform="translate(450, 110) scale(0.6)">
      <circle cx="20" cy="20" r="16" />
      <circle cx="20" cy="20" r="6" fill="#0284c7" opacity="0.2"/>
      <path d="M20 0v8M20 32v8M0 20h8M32 20h8M6 6l6 6M28 28l6 6M6 34l6-6M28 12l6-6" stroke-linecap="round"/>
    </g>
    <!-- Small Gear Left -->
    <g transform="translate(140, 100) scale(0.5)">
      <circle cx="20" cy="20" r="16" />
      <path d="M20 0v8M20 32v8M0 20h8M32 20h8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Center Desktop Computer Monitor -->
  <g filter="url(#dropShadow)">
    <!-- Stand -->
    <rect x="280" y="270" width="40" height="40" fill="#94a3b8" rx="4"/>
    <ellipse cx="300" cy="310" rx="60" ry="10" fill="#64748b"/>
    
    <!-- Monitor Outer Frame -->
    <rect x="170" y="100" width="260" height="170" fill="#0f172a" rx="12" stroke="#334155" stroke-width="4"/>
    
    <!-- Screen Display -->
    <rect x="180" y="110" width="240" height="150" fill="#ffffff" rx="6"/>
    
    <!-- Screen Header Bar -->
    <path d="M180 110h240v26H180z" fill="#f1f5f9"/>
    <circle cx="195" cy="123" r="4" fill="#ef4444"/>
    <circle cx="207" cy="123" r="4" fill="#f59e0b"/>
    <circle cx="219" cy="123" r="4" fill="#10b981"/>

    <!-- Screen Symfony Logo Box -->
    <rect x="200" y="146" width="200" height="100" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="300" cy="196" r="34" fill="#0284c7"/>
    <!-- Stylized 'sf' in Logo -->
    <text x="300" y="207" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#ffffff" text-anchor="middle">sf</text>
  </g>

  <!-- Developer Character 1 (Left Person) -->
  <g transform="translate(100, 160)">
    <!-- Body -->
    <path d="M35 80 L20 140 H45 L50 95 H60 L65 140 H90 L75 80 Z" fill="#1e293b"/>
    <!-- Shirt -->
    <path d="M30 50 C30 40, 80 40, 80 50 L75 85 H35 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="55" cy="25" r="16" fill="#fca5a5"/>
    <path d="M42 20 C42 8, 68 8, 68 20" fill="#475569"/> <!-- Hair -->
    <!-- Arm pointing at monitor -->
    <path d="M70 52 L110 35 L105 28 L65 46 Z" fill="#0284c7"/>
    <circle cx="110" cy="32" r="5" fill="#fca5a5"/>
  </g>

  <!-- Developer Character 2 (Middle Person - Back View Thinking) -->
  <g transform="translate(230, 180)">
    <!-- Legs -->
    <rect x="25" y="60" width="14" height="65" fill="#0f172a" rx="4"/>
    <rect x="45" y="60" width="14" height="65" fill="#0f172a" rx="4"/>
    <!-- Shirt -->
    <path d="M15 10 C15 0, 70 0, 70 10 L65 65 H20 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="42" cy="-10" r="16" fill="#334155"/> <!-- Hair Back -->
  </g>

  <!-- Developer Character 3 (Right Person - Woman in Yellow) -->
  <g transform="translate(420, 165)">
    <!-- Legs -->
    <path d="M30 80 L25 135 H40 L45 80 Z" fill="#fca5a5"/>
    <path d="M50 80 L55 135 H70 L60 80 Z" fill="#fca5a5"/>
    <!-- Yellow Dress/Outfit -->
    <path d="M25 40 Q42 35 60 40 L68 90 H18 Z" fill="#eab308"/>
    <!-- Head & Hair -->
    <circle cx="42" cy="20" r="15" fill="#fca5a5"/>
    <path d="M25 15 C20 -5, 65 -5, 60 15 L65 45 C55 45, 55 25, 42 25 C30 25, 30 45, 20 45 Z" fill="#78350f"/>
    <!-- Holding Tablet -->
    <rect x="10" y="45" width="30" height="22" fill="#334155" rx="3" transform="rotate(-15)"/>
  </g>

  <!-- Potted Plant Right -->
  <g transform="translate(530, 260)">
    <polygon points="10,40 30,40 35,70 5,70" fill="#0284c7"/>
    <path d="M20 40 C10 20, 0 10, -10 20 C5 30, 15 35, 20 40 Z" fill="#22c55e"/>
    <path d="M20 40 C30 20, 40 10, 50 20 C35 30, 25 35, 20 40 Z" fill="#16a34a"/>
    <path d="M20 40 C20 10, 20 0, 20 -10 C20 15, 20 30, 20 40 Z" fill="#15803d" stroke="#15803d" stroke-width="4"/>
  </g>
</svg>
