<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="symfonyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A171B"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- NO BACKGROUND SHAPE OR BACKDROP ELLIPSE - 100% TRANSPARENT BACKGROUND -->

  <!-- Floating Tech Badges (Transparent, Floating) -->
  <g transform="translate(60, 45)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="84" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#0284c7"/>
    <text x="48" y="20" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">PHP 8.3</text>
  </g>

  <g transform="translate(450, 40)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#10b981"/>
    <text x="58" y="20" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">API Platform</text>
  </g>

  <g transform="translate(435, 290)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="110" height="34" rx="8" fill="#1e293b"/>
    <text x="55" y="21" font-family="monospace" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">&lt;Symfony /&gt;</text>
  </g>

  <!-- Center Workstation / Monitor setup -->
  <g filter="url(#dropShadow)">
    <!-- Monitor Stand -->
    <rect x="280" y="275" width="40" height="35" fill="#94a3b8" rx="3"/>
    <path d="M240 310 H360 L350 318 H250 Z" fill="#64748b"/>
    
    <!-- Outer Screen Frame -->
    <rect x="150" y="90" width="300" height="190" fill="#0f172a" rx="12" stroke="#334155" stroke-width="3"/>
    
    <!-- Inner Screen Area -->
    <rect x="160" y="100" width="280" height="170" fill="#ffffff" rx="6"/>
    
    <!-- Screen Header Bar -->
    <path d="M160 100 h280 v28 H160 z" fill="#f8fafc"/>
    <line x1="160" y1="128" x2="440" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="178" cy="114" r="4" fill="#ef4444"/>
    <circle cx="190" cy="114" r="4" fill="#f59e0b"/>
    <circle cx="202" cy="114" r="4" fill="#10b981"/>
    <!-- Search Bar in Header -->
    <rect x="225" y="107" width="160" height="14" rx="7" fill="#e2e8f0"/>
    <text x="305" y="118" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">symfony.com/app</text>

    <!-- Code & Architecture Window Inside Screen -->
    <!-- Left Panel: Code view -->
    <rect x="172" y="138" width="130" height="120" fill="#1e293b" rx="6"/>
    <line x1="182" y1="152" x2="250" y2="152" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" y1="165" x2="280" y2="165" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="178" x2="260" y2="178" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="191" x2="230" y2="191" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" y1="204" x2="270" y2="204" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" y1="217" x2="220" y2="217" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Panel: Symfony Emblem & Components -->
    <rect x="312" y="138" width="116" height="120" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Symfony Big Badge -->
    <circle cx="370" cy="180" r="30" fill="url(#symfonyGrad)"/>
    <text x="370" y="191" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="26" fill="#ffffff" text-anchor="middle">sf</text>
    <!-- Component pill -->
    <rect x="330" y="222" width="80" height="20" rx="10" fill="url(#accentGrad)"/>
    <text x="370" y="235" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">MVC App</text>
  </g>

  <!-- Left Character: Developer pointing to Screen -->
  <g transform="translate(75, 175)">
    <!-- Body -->
    <path d="M40 85 L25 150 H52 L57 100 H67 L72 150 H98 L83 85 Z" fill="#1e293b"/>
    <!-- Shirt -->
    <path d="M35 50 C35 40, 88 40, 88 50 L83 90 H39 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="61" cy="25" r="17" fill="#fca5a5"/>
    <path d="M47 20 C47 7, 75 7, 75 20" fill="#334155"/>
    <!-- Arm pointing -->
    <path d="M78 52 L118 36 L113 29 L73 46 Z" fill="#0284c7"/>
    <circle cx="118" cy="33" r="5" fill="#fca5a5"/>
  </g>

  <!-- Right Character: Developer sitting with Laptop on desk -->
  <g transform="translate(450, 180)">
    <!-- Chair & Body -->
    <path d="M30 85 L25 145 H42 L47 95 Z" fill="#334155"/>
    <path d="M50 85 L55 145 H72 L62 85 Z" fill="#334155"/>
    <!-- Top outfit -->
    <path d="M22 45 C22 35, 75 35, 75 45 L68 90 H28 Z" fill="#005F96"/>
    <!-- Head -->
    <circle cx="48" cy="20" r="16" fill="#fca5a5"/>
    <path d="M32 15 C28 -2, 70 -2, 64 15 C60 12, 36 12, 32 15 Z" fill="#78350f"/>
    <!-- Arm holding tablet -->
    <rect x="5" y="55" width="35" height="24" rx="4" fill="#0f172a" transform="rotate(-10)"/>
    <rect x="8" y="58" width="29" height="18" rx="2" fill="#38bdf8" transform="rotate(-10)"/>
  </g>

  <!-- Plant on Left Floor -->
  <g transform="translate(30, 275)">
    <polygon points="10,40 28,40 33,68 5,68" fill="#0284c7"/>
    <path d="M19 40 C8 20, 0 10, -10 20 C5 30, 15 35, 19 40 Z" fill="#22c55e"/>
    <path d="M19 40 C30 20, 40 10, 50 20 C35 30, 25 35, 19 40 Z" fill="#16a34a"/>
    <path d="M19 40 C19 10, 19 0, 19 -10 C19 15, 19 30, 19 40 Z" fill="#15803d" stroke="#15803d" stroke-width="3"/>
  </g>
</svg>
