<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="coinTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="blueGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="orangeGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background Floating Decorative Elements -->
  <!-- Top Left Flying Paper Plane -->
  <g transform="translate(240, 35)">
    <path d="M 0 15 L 28 0 L 18 24 L 11 17 Z" fill="#0284C7" />
    <path d="M 11 17 L 28 0 L 15 15 Z" fill="#38BDF8" />
    <path d="M 0 15 L 11 17 L 7 24 Z" fill="#0369A1" />
    <!-- Trail -->
    <path d="M -25 28 Q -10 24 0 15" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" fill="none" />
  </g>

  <!-- Top Right Floating Accent Icons -->
  <g transform="translate(490, 45)">
    <!-- Small plus -->
    <path d="M -50 0 H -40 M -45 -5 V 5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Yellow Ring -->
    <circle cx="-25" cy="15" r="5" stroke="#F59E0B" stroke-width="2" fill="none" />
    <!-- Light Blue Plus -->
    <path d="M 10 -10 H 20 M 15 -15 V -5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Yellow Box Icon -->
    <rect x="0" y="15" width="16" height="16" rx="3" fill="#F59E0B" />
    <circle cx="8" cy="23" r="4" fill="#FFFFFF" />
  </g>

  <!-- Background Gear Outlines -->
  <g opacity="0.25">
    <circle cx="370" cy="50" r="18" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 3" fill="none" />
    <circle cx="100" cy="110" r="16" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 3" fill="none" />
    <circle cx="510" cy="150" r="22" stroke="#0284C7" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  </g>

  <!-- Left Floating Exclamation Badge -->
  <g transform="translate(85, 195)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284C7" />
    <text x="11" y="16" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle" font-family="sans-serif">!</text>
  </g>

  <!-- ================= CENTRAL MONITOR ================= -->
  <g id="monitor-group">
    <!-- Monitor Stand Base -->
    <ellipse cx="360" cy="330" rx="45" ry="6" fill="#94A3B8" />
    <rect x="351" y="270" width="18" height="62" rx="3" fill="#CBD5E1" />

    <!-- Monitor Outer Bezel -->
    <rect x="230" y="100" width="260" height="175" rx="10" fill="#0F172A" />
    <!-- Screen Inner White Background -->
    <rect x="236" y="106" width="248" height="163" rx="6" fill="#FFFFFF" />

    <!-- Monitor Top Header Bar -->
    <rect x="236" y="106" width="248" height="20" fill="#0F172A" rx="6" />
    <rect x="236" y="120" width="248" height="6" fill="#0F172A" />
    <!-- Header Window Buttons -->
    <circle cx="248" cy="116" r="3" fill="#EF4444" />
    <circle cx="258" cy="116" r="3" fill="#F59E0B" />
    <circle cx="268" cy="116" r="3" fill="#10B981" />

    <!-- Monitor Screen Content -->
    <!-- Left Bar Lines & UI Graphics -->
    <g transform="translate(252, 138)">
      <rect x="0" y="0" width="80" height="8" rx="4" fill="#0284C7" />
      <rect x="0" y="14" width="110" height="8" rx="4" fill="#F59E0B" />
      <rect x="0" y="28" width="90" height="8" rx="4" fill="#0284C7" />
      <rect x="0" y="42" width="60" height="6" rx="3" fill="#CBD5E1" />
    </g>

    <!-- Doughnut Pie Chart on Right of Monitor Screen -->
    <g transform="translate(425, 172)">
      <!-- Outer Blue Doughnut Arc (approx 70%) -->
      <circle cx="0" cy="0" r="34" stroke="#0284C7" stroke-width="18" fill="none" stroke-dasharray="150 212" stroke-dashoffset="0" transform="rotate(-90)" />
      <!-- Top-Right Yellow Doughnut Arc (approx 30%) -->
      <circle cx="0" cy="0" r="34" stroke="#FFB800" stroke-width="18" fill="none" stroke-dasharray="62 212" stroke-dashoffset="-150" transform="rotate(-90)" />
      <!-- Center Hole Cover -->
      <circle cx="0" cy="0" r="25" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ================= GOLD COINS STACK (LEFT) ================= -->
  <g id="gold-coins-left" transform="translate(80, 220)">
    <!-- Column 1 (Back Left, 5 coins) -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="34" height="80" rx="17" fill="url(#coinGrad)" />
      <!-- Coin Rim Details -->
      <ellipse cx="17" cy="0" rx="17" ry="7" fill="url(#coinTop)" />
      <ellipse cx="17" cy="16" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="32" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="48" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="64" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="80" rx="17" ry="7" fill="url(#coinTop)" />
    </g>

    <!-- Column 2 (Middle Left, tallest, 7 coins) -->
    <g transform="translate(22, 0)">
      <rect x="0" y="0" width="34" height="100" rx="17" fill="url(#coinGrad)" />
      <ellipse cx="17" cy="0" rx="17" ry="7" fill="url(#coinTop)" />
      <ellipse cx="17" cy="16" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="32" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="48" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="64" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="80" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="100" rx="17" ry="7" fill="url(#coinTop)" />
    </g>

    <!-- Column 3 (Front Right of stack, 4 coins) -->
    <g transform="translate(44, 40)">
      <rect x="0" y="0" width="34" height="60" rx="17" fill="url(#coinGrad)" />
      <ellipse cx="17" cy="0" rx="17" ry="7" fill="url(#coinTop)" />
      <ellipse cx="17" cy="16" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="32" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="48" rx="17" ry="6" fill="none" stroke="#D97706" stroke-width="1.5" />
      <ellipse cx="17" cy="60" rx="17" ry="7" fill="url(#coinTop)" />
    </g>
  </g>

  <!-- ================= FEMALE CHARACTER (STANDING ON LEFT) ================= -->
  <g id="female-character" transform="translate(160, 120)">
    <!-- Shadow under feet -->
    <ellipse cx="30" cy="202" rx="20" ry="4" fill="#0F172A" opacity="0.2" />

    <!-- Legs & Yellow Pants -->
    <!-- Left Leg -->
    <path d="M 18 115 L 14 195 L 26 195 L 28 115 Z" fill="#F59E0B" />
    <!-- Right Leg -->
    <path d="M 32 115 L 36 195 L 48 195 L 42 115 Z" fill="#F59E0B" />
    <!-- Blue Shoes -->
    <ellipse cx="18" cy="196" rx="10" ry="4" fill="#0284C7" />
    <ellipse cx="44" cy="196" rx="10" ry="4" fill="#0284C7" />

    <!-- Torso & Blue Top -->
    <path d="M 14 45 L 46 45 C 50 70, 48 95, 46 118 L 14 118 C 12 95, 10 70, 14 45 Z" fill="#0284C7" />
    <!-- Neck -->
    <rect x="25" y="32" width="10" height="15" fill="#FED7AA" />

    <!-- Head & Hair -->
    <circle cx="30" cy="22" r="14" fill="#FED7AA" />
    <!-- Dark Navy Hair -->
    <path d="M 15 22 C 15 6, 45 6, 45 22 C 45 14, 38 10, 30 10 C 22 10, 15 14, 15 22 Z" fill="#0F172A" />
    <!-- Back Ponytail -->
    <path d="M 16 18 C 8 20, 6 32, 10 40 C 14 42, 18 35, 18 24 Z" fill="#0F172A" />

    <!-- Left Arm (Relaxed down) -->
    <path d="M 14 48 C 6 70, 8 90, 10 105" stroke="#FED7AA" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 14 48 C 6 70, 8 90, 10 105" stroke="#0284C7" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="25 100" />

    <!-- Right Arm (Extended pointing to screen) -->
    <path d="M 44 48 L 110 32" stroke="#FED7AA" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Blue Sleeve -->
    <path d="M 44 48 L 68 44" stroke="#0284C7" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Hand & Pointing Finger -->
    <circle cx="112" cy="31" r="4" fill="#FED7AA" />
  </g>

  <!-- ================= GEARS & COINS ON GROUND (BOTTOM CENTER-RIGHT) ================= -->
  <g id="bottom-gears-coins" transform="translate(300, 240)">
    <!-- Small Orange Gear (Left) -->
    <g transform="translate(20, 45)">
      <!-- Teeth -->
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="url(#orangeGearGrad)" transform="rotate(0)" />
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="url(#orangeGearGrad)" transform="rotate(45)" />
      <circle cx="0" cy="0" r="16" fill="url(#orangeGearGrad)" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
    </g>

    <!-- Large Blue Gear (Right) -->
    <g transform="translate(70, 25)">
      <!-- Teeth -->
      <rect x="-28" y="-28" width="56" height="56" rx="6" fill="url(#blueGearGrad)" transform="rotate(0)" />
      <rect x="-28" y="-28" width="56" height="56" rx="6" fill="url(#blueGearGrad)" transform="rotate(30)" />
      <rect x="-28" y="-28" width="56" height="56" rx="6" fill="url(#blueGearGrad)" transform="rotate(60)" />
      <circle cx="0" cy="0" r="24" fill="url(#blueGearGrad)" />
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
    </g>

    <!-- Ground Coins beneath gears -->
    <g transform="translate(35, 68)">
      <ellipse cx="0" cy="0" rx="18" ry="6" fill="url(#coinGrad)" stroke="#D97706" stroke-width="1" />
      <ellipse cx="0" cy="-2" rx="18" ry="5" fill="url(#coinTop)" />
      <ellipse cx="22" cy="2" rx="18" ry="6" fill="url(#coinGrad)" stroke="#D97706" stroke-width="1" />
      <ellipse cx="22" cy="0" rx="18" ry="5" fill="url(#coinTop)" />
    </g>
  </g>

  <!-- ================= MALE CHARACTER (KNEELING ON RIGHT) ================= -->
  <g id="male-character" transform="translate(420, 160)">
    <!-- Shadow under kneeling pose -->
    <ellipse cx="50" cy="162" rx="35" ry="6" fill="#0F172A" opacity="0.2" />

    <!-- Legs & Kneeling Pants -->
    <!-- Left Leg (Kneeling flat on floor) -->
    <path d="M 40 85 L 85 130 L 95 155 L 75 158 L 65 135 L 30 95 Z" fill="#0F172A" />
    <!-- Right Leg (Foot planted) -->
    <path d="M 25 85 L 10 120 L 15 158 L 32 158 L 28 120 L 40 85 Z" fill="#0F172A" />
    <!-- Shoes (Yellow) -->
    <ellipse cx="85" cy="157" rx="12" ry="5" fill="#F59E0B" />
    <ellipse cx="22" cy="157" rx="12" ry="5" fill="#F59E0B" />

    <!-- Torso & Royal Blue Jacket -->
    <path d="M 18 28 L 52 28 L 46 88 L 18 88 Z" fill="#2563EB" />
    <!-- Collar & Tie Detail -->
    <polygon points="30,28 35,42 40,28" fill="#FFFFFF" />

    <!-- Head & Hair -->
    <circle cx="34" cy="14" r="12" fill="#FED7AA" />
    <!-- Short Dark Hair -->
    <path d="M 22 14 C 22 2, 46 2, 46 14 C 46 8, 40 5, 34 5 C 28 5, 22 8, 22 14 Z" fill="#0F172A" />

    <!-- Arms (Holding & turning gear) -->
    <!-- Left Arm -->
    <path d="M 20 32 L -15 65 L -35 85" stroke="#2563EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="-36" cy="86" r="4.5" fill="#FED7AA" />
    <!-- Right Arm -->
    <path d="M 48 32 L 5 70 L -25 92" stroke="#2563EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="-26" cy="93" r="4.5" fill="#FED7AA" />
  </g>
</svg>
