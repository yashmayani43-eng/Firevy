<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="codeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Cloud Silhouette matching screenshot -->
  <path d="M 60 210 C 40 170 60 130 110 120 C 130 65 210 55 260 95 C 300 35 410 35 450 85 C 500 105 520 160 490 210 C 515 260 475 310 415 320 C 365 330 130 330 80 290 C 55 270 45 240 60 210 Z" fill="#EEF6FB" />

  <!-- Ground subtle baseline -->
  <line x1="70" y1="326" x2="485" y2="326" stroke="#DCE8F1" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= SMARTPHONE (Right Side) ================= -->
  <g filter="url(#softGlow)">
    <!-- Outer Phone Body with Soft Cyan-Blue Bezel -->
    <rect x="290" y="60" width="168" height="266" rx="20" fill="#294A6B" stroke="#48759C" stroke-width="4" />
    <!-- Inner Deep Navy Screen -->
    <rect x="298" y="70" width="152" height="246" rx="14" fill="#182A3E" />
    <!-- Speaker & Sensor -->
    <circle cx="350" cy="78" r="2.5" fill="#3D5A7A" />
    <rect x="360" y="76.5" width="28" height="3" rx="1.5" fill="#3D5A7A" />

    <!-- Screen Content: Top Card Left (Avatar Icon) -->
    <rect x="312" y="94" width="48" height="48" rx="8" fill="#EBF2F8" />
    <circle cx="336" cy="112" r="9.5" fill="#38BDF8" />
    <path d="M 323 133 C 323 125 329 123 336 123 C 343 123 349 125 349 133 Z" fill="#38BDF8" />

    <!-- Screen Content: Top Card Right (Gallery / Mountain Photo) -->
    <rect x="368" y="94" width="70" height="48" rx="8" fill="#EBF2F8" />
    <circle cx="420" cy="106" r="4.5" fill="#60A5FA" />
    <path d="M 376 134 L 391 117 L 401 127 L 414 113 L 430 134 Z" fill="#93C5FD" />

    <!-- Screen Content: Middle Card Left (Yellow Folder) -->
    <rect x="312" y="150" width="48" height="42" rx="8" fill="#EBF2F8" />
    <path d="M 322 161 L 331 161 L 335 165 L 350 165 C 352 165 353 166 353 168 L 353 181 C 353 183 352 184 350 184 L 322 184 C 320 184 319 183 319 181 L 319 164 C 319 162 320 161 322 161 Z" fill="#F59E0B" />

    <!-- Screen Content: Middle Card Right (Text Lines Placeholder) -->
    <rect x="368" y="154" width="70" height="6" rx="3" fill="#C5D9EB" />
    <rect x="368" y="166" width="58" height="5" rx="2.5" fill="#C5D9EB" />
    <rect x="368" y="177" width="64" height="5" rx="2.5" fill="#C5D9EB" />
    <rect x="368" y="188" width="45" height="5" rx="2.5" fill="#C5D9EB" />

    <!-- Screen Content: Bottom Card Left (Cyan Play Button) -->
    <rect x="312" y="200" width="48" height="38" rx="8" fill="#38BDF8" />
    <polygon points="332,211 332,227 344,219" fill="#FFFFFF" />

    <!-- Screen Content: Bottom Card Right (Blue Music Note) -->
    <rect x="374" y="200" width="48" height="38" rx="8" fill="#60A5FA" />
    <!-- Music Note -->
    <circle cx="390" cy="224" r="3.5" fill="#FFFFFF" />
    <circle cx="403" cy="220" r="3.5" fill="#FFFFFF" />
    <path d="M 393 224 L 393 209 L 406 205 L 406 220" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="393,209 406,205 406,210 393,214" fill="#FFFFFF" />
  </g>

  <!-- ================= PROGRAMMER & DESK (Left Side) ================= -->
  <!-- Desk Chair Base & Stem -->
  <path d="M 165 225 L 165 275 L 155 295 L 175 295 M 165 275 L 165 320 M 150 320 L 180 320" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <rect x="158" y="224" width="22" height="6" rx="2" fill="#1E293B" />
  <rect x="154" y="192" width="6" height="32" rx="3" fill="#1E293B" />

  <!-- Person Body (Seated Developer) -->
  <!-- Legs -->
  <path d="M 175 228 L 195 248 L 195 295 L 207 295" stroke="#1E293B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 168 228 L 185 248 L 185 295 L 175 295" stroke="#0F172A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shoes -->
  <ellipse cx="207" cy="298" rx="8" ry="4" fill="#0F172A" />
  <ellipse cx="175" cy="298" rx="7" ry="4" fill="#0F172A" />

  <!-- Torso & Blue Jacket -->
  <path d="M 170 188 C 165 198 165 228 175 233 L 190 233 C 195 213 195 193 188 188 Z" fill="#2563EB" />
  <!-- White Shirt & Pink Tie -->
  <polygon points="177,188 183,188 181,211 179,211" fill="#FFFFFF" />
  <polygon points="179,191 182,191 183,208 180.5,213 178,208" fill="#FB7185" />

  <!-- Head & Hair -->
  <circle cx="179" cy="171" r="9" fill="#FED7AA" />
  <!-- Black Hair -->
  <path d="M 170 170 C 170 161 187 159 189 167 C 186 164 177 164 174 170 Z" fill="#0F172A" />

  <!-- Arms typing on laptop -->
  <path d="M 176 198 L 195 215 L 212 218" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="214" cy="219" r="3.5" fill="#FED7AA" />

  <!-- White Table Desk with slender metal legs -->
  <rect x="155" y="230" width="105" height="6" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
  <line x1="165" y1="236" x2="165" y2="326" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="250" y1="236" x2="250" y2="326" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Laptop on Desk -->
  <rect x="200" y="228" width="35" height="3" rx="1" fill="#94A3B8" />
  <!-- Laptop open display -->
  <polygon points="220,207 237,207 234,228 220,228" fill="#38BDF8" stroke="#64748B" stroke-width="1.5" />

  <!-- ================= FLOATING CODE WINDOW ================= -->
  <g filter="url(#codeGlow)">
    <!-- Main Window Frame -->
    <rect x="170" y="88" width="85" height="110" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Header Bar with </> -->
    <rect x="170" y="88" width="85" height="22" rx="6" fill="#0369A1" />
    <text x="178" y="104" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">&lt;/&gt;</text>
    <circle cx="244" cy="99" r="2.5" fill="#38BDF8" />
    <circle cx="236" cy="99" r="2.5" fill="#38BDF8" />

    <!-- Code Syntax Highlight Lines inside Window -->
    <!-- Line 1 -->
    <rect x="178" y="119" width="22" height="4" rx="2" fill="#F472B6" />
    <rect x="204" y="119" width="32" height="4" rx="2" fill="#FDE047" />
    <!-- Line 2 -->
    <rect x="184" y="128" width="38" height="4" rx="2" fill="#93C5FD" />
    <rect x="226" y="128" width="18" height="4" rx="2" fill="#F472B6" />
    <!-- Line 3 -->
    <rect x="184" y="137" width="28" height="4" rx="2" fill="#FDE047" />
    <rect x="216" y="137" width="24" height="4" rx="2" fill="#FFFFFF" />
    <!-- Line 4 -->
    <rect x="190" y="146" width="45" height="4" rx="2" fill="#93C5FD" />
    <!-- Line 5 -->
    <rect x="184" y="155" width="20" height="4" rx="2" fill="#F472B6" />
    <rect x="208" y="155" width="34" height="4" rx="2" fill="#FDE047" />
    <!-- Line 6 -->
    <rect x="178" y="164" width="30" height="4" rx="2" fill="#93C5FD" />
    <rect x="212" y="164" width="25" height="4" rx="2" fill="#FFFFFF" />
    <!-- Line 7 -->
    <rect x="178" y="173" width="16" height="4" rx="2" fill="#F472B6" />
    <!-- Line 8 -->
    <rect x="178" y="182" width="48" height="4" rx="2" fill="#FDE047" />
  </g>
</svg>
