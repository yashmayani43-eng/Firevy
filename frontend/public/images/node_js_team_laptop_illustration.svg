<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%" fill="none">
  <defs>
    <filter id="node-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. DECORATIVE BACKGROUND LEAVES (LEFT & RIGHT) -->
  <g fill="#38BDF8" opacity="0.35">
    <!-- Left Background Leaves -->
    <path d="M 120,180 C 100,140 130,100 170,110 C 190,140 160,190 120,180 Z" />
    <path d="M 170,140 C 160,100 200,70 230,90 C 240,120 200,160 170,140 Z" />
    <!-- Right Background Leaves -->
    <path d="M 630,180 C 650,140 620,100 580,110 C 560,140 590,190 630,180 Z" />
    <path d="M 580,140 C 590,100 550,70 520,90 C 510,120 550,160 580,140 Z" />
  </g>

  <!-- 2. LARGE LAPTOP SCREEN IN CENTER BACKGROUND -->
  <g filter="url(#node-drop-shadow)">
    <!-- Laptop Outer Screen Bezel (Dark Slate Navy) -->
    <rect x="180" y="60" width="390" height="250" rx="14" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <circle cx="375" cy="72" r="3" fill="#64748B" />

    <!-- Inner Display Screen -->
    <rect x="194" y="82" width="362" height="216" rx="4" fill="#F8FAFC" />
    <!-- Top Header Strip inside Screen -->
    <rect x="204" y="92" width="80" height="12" rx="3" fill="#E2E8F0" />

    <!-- Circular Node.js Logo in Center Screen -->
    <circle cx="375" cy="180" r="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Node.js Green Hexagon & Text -->
    <path d="M 375,152 L 392,162 V 180 L 375,190 L 358,180 V 162 Z" fill="#339933" />
    <path d="M 375,152 V 171 M 375,171 L 392,162 M 375,171 L 358,162 M 375,171 V 190" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="375" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#339933">node<tspan font-size="10" font-weight="700">.js</tspan></text>

    <!-- Laptop Base Stand/Keyboard Edge (Bottom Line) -->
    <path d="M 140,310 H 610 V 322 C 610,326 606,328 600,328 H 150 C 144,328 140,326 140,322 Z" fill="#334155" />
    <rect x="335" y="312" width="80" height="4" rx="2" fill="#64748B" />
  </g>

  <!-- 3. TWO BLUE SPEECH BUBBLES WITH THREE DOTS (LEFT & RIGHT) -->
  <!-- Left Speech Bubble -->
  <g transform="translate(160, 100)" filter="url(#bubble-shadow)">
    <rect x="0" y="0" width="115" height="65" rx="14" fill="#38BDF8" />
    <path d="M 90,65 L 105,80 V 65 Z" fill="#38BDF8" />
    <circle cx="35" cy="32.5" r="5" fill="#FFFFFF" />
    <circle cx="57.5" cy="32.5" r="5" fill="#FFFFFF" />
    <circle cx="80" cy="32.5" r="5" fill="#FFFFFF" />
  </g>

  <!-- Right Speech Bubble -->
  <g transform="translate(475, 100)" filter="url(#bubble-shadow)">
    <rect x="0" y="0" width="115" height="65" rx="14" fill="#0284C7" />
    <path d="M 25,65 L 10,80 V 65 Z" fill="#0284C7" />
    <circle cx="35" cy="32.5" r="5" fill="#FFFFFF" />
    <circle cx="57.5" cy="32.5" r="5" fill="#FFFFFF" />
    <circle cx="80" cy="32.5" r="5" fill="#FFFFFF" />
  </g>

  <!-- 4. POTTED PLANTS (FAR LEFT & FAR RIGHT) -->
  <!-- Left Potted Plant -->
  <g transform="translate(50, 180)">
    <!-- Leaves -->
    <path d="M 40,110 C 10,80 0,30 35,10 C 60,40 50,90 40,110 Z" fill="#0284C7" />
    <path d="M 40,110 C 70,80 80,30 45,10 C 20,40 30,90 40,110 Z" fill="#38BDF8" />
    <path d="M 40,110 C 20,60 30,20 40,0 C 50,20 60,60 40,110 Z" fill="#0EA5E9" />
    <!-- Pot -->
    <path d="M 15,105 H 65 L 58,150 H 22 Z" fill="#1E293B" />
    <path d="M 22,120 L 30,126 L 38,120 L 46,126 L 54,120" stroke="#38BDF8" stroke-width="2" fill="none" />
  </g>

  <!-- Right Potted Plant -->
  <g transform="translate(640, 180)">
    <!-- Leaves -->
    <path d="M 40,110 C 10,80 0,30 35,10 C 60,40 50,90 40,110 Z" fill="#0284C7" />
    <path d="M 40,110 C 70,80 80,30 45,10 C 20,40 30,90 40,110 Z" fill="#38BDF8" />
    <path d="M 40,110 C 20,60 30,20 40,0 C 50,20 60,60 40,110 Z" fill="#0EA5E9" />
    <!-- Pot -->
    <path d="M 15,105 H 65 L 58,150 H 22 Z" fill="#1E293B" />
    <path d="M 22,120 L 30,126 L 38,120 L 46,126 L 54,120" stroke="#38BDF8" stroke-width="2" fill="none" />
  </g>

  <!-- 5. THREE DEVELOPERS SITTING IN FRONT -->

  <!-- Developer 1 (Left - Blue Sweater Sitting with Laptop) -->
  <g transform="translate(205, 210)">
    <!-- Legs hanging -->
    <rect x="32" y="115" width="10" height="75" rx="5" fill="#1E293B" />
    <rect x="48" y="115" width="10" height="75" rx="5" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="37" cy="192" rx="7" ry="4" fill="#38BDF8" />
    <ellipse cx="53" cy="192" rx="7" ry="4" fill="#38BDF8" />

    <!-- Body / Blue Sweater -->
    <path d="M 25,60 C 25,45 35,35 45,35 C 55,35 65,45 65,60 V 115 H 25 Z" fill="#0284C7" />
    <!-- Arms holding laptop -->
    <path d="M 25,50 L 5,85 L 35,85" stroke="#0284C7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop -->
    <path d="M 3,75 L 48,75 L 53,105 L -2,105 Z" fill="#0EA5E9" />

    <!-- Head -->
    <circle cx="45" cy="22" r="14" fill="#FED7AA" />
    <path d="M 32,18 C 32,8 42,6 52,10 C 56,15 54,24 54,24 Z" fill="#0F172A" />
    <circle cx="42" cy="22" r="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
  </g>

  <!-- Developer 2 (Middle - Smiling Developer Sitting Cross-Legged) -->
  <g transform="translate(325, 185)">
    <!-- Legs Cross-Legged -->
    <path d="M 15,140 C 25,160 75,160 85,140 Z" fill="#1E293B" />
    <path d="M 0,130 C 25,145 75,145 100,130 Z" fill="#0F172A" />

    <!-- Body / Bright Blue Shirt -->
    <path d="M 30,55 C 30,40 40,30 50,30 C 60,30 70,40 70,55 V 125 H 30 Z" fill="#0284C7" />

    <!-- Laptop on Lap -->
    <rect x="25" y="85" width="50" height="30" rx="4" fill="#94A3B8" />

    <!-- Head & Smiling Face -->
    <circle cx="50" cy="18" r="15" fill="#FDE68A" />
    <path d="M 35,14 C 35,4 50,2 65,8 C 68,14 65,22 65,22 Z" fill="#0F172A" />
    <circle cx="44" cy="18" r="2" fill="#0F172A" />
    <circle cx="56" cy="18" r="2" fill="#0F172A" />
    <path d="M 44,24 Q 50,30 56,24" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Developer 3 (Right - Female Developer in Yellow Sweater with Laptop) -->
  <g transform="translate(435, 210)">
    <!-- Legs hanging -->
    <rect x="35" y="115" width="10" height="75" rx="5" fill="#1E293B" />
    <rect x="50" y="115" width="10" height="75" rx="5" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="40" cy="192" rx="7" ry="4" fill="#38BDF8" />
    <ellipse cx="55" cy="192" rx="7" ry="4" fill="#38BDF8" />

    <!-- Body / Yellow Sweater -->
    <path d="M 28,60 C 28,45 38,35 48,35 C 58,35 68,45 68,60 V 115 H 28 Z" fill="#F59E0B" />
    <!-- Arms holding laptop -->
    <path d="M 68,50 L 88,85 L 58,85" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop -->
    <path d="M 40,75 L 85,75 L 90,105 L 35,105 Z" fill="#0284C7" />

    <!-- Head & Hair -->
    <circle cx="48" cy="22" r="14" fill="#FED7AA" />
    <path d="M 32,18 C 30,5 50,0 60,10 C 65,20 66,45 62,55 Z" fill="#0F172A" />
  </g>

  <!-- 6. SLEEK BASE GROUND LINE -->
  <line x1="20" y1="330" x2="730" y2="330" stroke="#0F172A" stroke-width="1.5" />
</svg>
