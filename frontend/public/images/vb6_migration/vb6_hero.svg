<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F9" />
      <stop offset="100%" stop-color="#D5ECF8" />
    </linearGradient>
    <linearGradient id="vb6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect x="20" y="20" width="560" height="360" rx="24" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="170" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

  <!-- LEFT CARD: Legacy VB6 Architecture -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="80" width="200" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Header -->
    <path d="M 50 96 C 50 87.16 57.16 80 66 80 L 234 80 C 242.84 80 250 87.16 250 96 L 250 125 L 50 125 Z" fill="#F8FAFC" />
    <circle cx="70" cy="102" r="4.5" fill="#EF4444" />
    <circle cx="84" cy="102" r="4.5" fill="#F59E0B" />
    <circle cx="98" cy="102" r="4.5" fill="#10B981" />
    <text x="135" y="107" fill="#64748B" font-size="11" font-weight="700" font-family="system-ui, sans-serif">VB6 Legacy</text>
    
    <!-- VB6 Icon / Badge -->
    <rect x="70" y="140" width="46" height="46" rx="10" fill="url(#vb6Grad)" />
    <text x="77" y="170" fill="#FFFFFF" font-size="16" font-weight="900" font-family="system-ui, sans-serif">VB6</text>
    <rect x="126" y="148" width="105" height="10" rx="5" fill="#E2E8F0" />
    <rect x="126" y="166" width="75" height="8" rx="4" fill="#F1F5F9" />

    <!-- Code Simulation -->
    <rect x="70" y="200" width="160" height="8" rx="4" fill="#CBD5E1" />
    <rect x="70" y="216" width="120" height="8" rx="4" fill="#E2E8F0" />
    <rect x="70" y="232" width="145" height="8" rx="4" fill="#F1F5F9" />
    
    <!-- Warning tag -->
    <rect x="70" y="260" width="160" height="36" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <circle cx="86" cy="278" r="7" fill="#EF4444" />
    <text x="83.5" y="282" fill="#FFFFFF" font-size="10" font-weight="900">!</text>
    <text x="100" y="278" fill="#991B1B" font-size="9.5" font-weight="700" font-family="system-ui, sans-serif">EOL &amp; Security Risks</text>
    <text x="100" y="289" fill="#B91C1C" font-size="8" font-family="system-ui, sans-serif">Unsupported 32-bit Runtime</text>
  </g>

  <!-- CENTRAL TRANSFORMATION ARROW & COG -->
  <g transform="translate(262, 160)">
    <!-- Pulse Ring -->
    <circle cx="38" cy="40" r="32" fill="#FFFFFF" filter="url(#cardShadow)" />
    <circle cx="38" cy="40" r="26" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
    
    <!-- Modernization Arrow -->
    <path d="M 28 40 L 46 40 M 40 33 L 47 40 L 40 47" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic particle dots -->
    <circle cx="38" cy="6" r="3" fill="#10B981" />
    <circle cx="38" cy="74" r="3" fill="#7C3AED" />
  </g>

  <!-- RIGHT CARD: Modern .NET Core & Cloud -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="80" width="200" height="240" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <!-- Header -->
    <path d="M 350 96 C 350 87.16 357.16 80 366 80 L 534 80 C 542.84 80 550 87.16 550 96 L 550 125 L 350 125 Z" fill="#F0F9FF" />
    <circle cx="370" cy="102" r="4.5" fill="#EF4444" />
    <circle cx="384" cy="102" r="4.5" fill="#F59E0B" />
    <circle cx="398" cy="102" r="4.5" fill="#10B981" />
    <text x="430" y="107" fill="#0369A1" font-size="11" font-weight="800" font-family="system-ui, sans-serif">.NET 8 / C# Cloud</text>
    
    <!-- .NET Icon / Badge -->
    <rect x="370" y="140" width="46" height="46" rx="10" fill="url(#netGrad)" />
    <text x="374" y="169" fill="#FFFFFF" font-size="14" font-weight="900" font-family="system-ui, sans-serif">.NET</text>
    <rect x="426" y="148" width="105" height="10" rx="5" fill="#BAE6FD" />
    <rect x="426" y="166" width="75" height="8" rx="4" fill="#E0F2FE" />

    <!-- Code Simulation -->
    <rect x="370" y="200" width="160" height="8" rx="4" fill="#0284C7" opacity="0.8" />
    <rect x="370" y="216" width="130" height="8" rx="4" fill="#38BDF8" opacity="0.7" />
    <rect x="370" y="232" width="150" height="8" rx="4" fill="#BAE6FD" />
    
    <!-- Modern Success Tag -->
    <rect x="370" y="260" width="160" height="36" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
    <circle cx="386" cy="278" r="7" fill="#10B981" />
    <path d="M 383 278 L 385.5 280.5 L 389.5 275.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="400" y="278" fill="#065F46" font-size="9.5" font-weight="800" font-family="system-ui, sans-serif">100% Cloud Native</text>
    <text x="400" y="289" fill="#047857" font-size="8" font-family="system-ui, sans-serif">64-bit High Performance</text>
  </g>

  <!-- Top Floating Feature Chips -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="44" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="94" cy="57" r="4" fill="#7C3AED" />
    <text x="105" y="61" fill="#475569" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Legacy Codebase</text>
    
    <rect x="390" y="44" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#BAE6FD" />
    <circle cx="404" cy="57" r="4" fill="#10B981" />
    <text x="415" y="61" fill="#0369A1" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Zero Downtime</text>
  </g>
</svg>
