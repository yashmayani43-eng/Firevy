<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" fill="none">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect x="15" y="15" width="550" height="350" rx="20" fill="url(#aboutBg)" />

  <!-- Background Decorative Grid Lines -->
  <line x1="50" y1="120" x2="530" y2="120" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="50" y1="220" x2="530" y2="220" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="200" y1="40" x2="200" y2="340" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="380" y1="40" x2="380" y2="340" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Central Cloud Infrastructure Core -->
  <g filter="url(#aboutShadow)">
    <rect x="190" y="70" width="200" height="230" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    
    <!-- Cloud Icon Circle -->
    <circle cx="290" cy="120" r="32" fill="url(#cloudGrad)" />
    <!-- Cloud SVG Path -->
    <path d="M 276 128 C 272 128 268 124 268 120 C 268 116.5 270.5 113.5 274 112.5 C 274.5 106 280 101 286.5 101 C 291.5 101 296 104 298 108.5 C 299.5 107.5 301 107 303 107 C 307.5 107 311 110.5 311 115 C 311 115.5 311 116 310.8 116.5 C 313.3 118 315 120.5 315 123.5 C 315 127.5 311.5 131 307.5 131 L 276 131 Z" fill="#FFFFFF" />

    <text x="290" y="174" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="800" font-family="system-ui, sans-serif">Modernized .NET</text>
    <text x="290" y="190" text-anchor="middle" fill="#64748B" font-size="10" font-family="system-ui, sans-serif">Cloud &amp; Microservices</text>

    <!-- Checklist inside central card -->
    <circle cx="215" cy="216" r="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <path d="M 212 216 L 214.5 218.5 L 218 214" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="228" y="219" fill="#334155" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">100% Business Logic Kept</text>

    <circle cx="215" cy="238" r="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <path d="M 212 238 L 214.5 240.5 L 218 236" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="228" y="241" fill="#334155" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Automated Code Validation</text>

    <circle cx="215" cy="260" r="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <path d="M 212 260 L 214.5 262.5 L 218 258" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="228" y="263" fill="#334155" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Zero Data Loss Migration</text>
  </g>

  <!-- Left Supporting Card: Source Legacy Code Assessment -->
  <g filter="url(#aboutShadow)">
    <rect x="40" y="110" width="135" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="65" cy="135" r="14" fill="#F1F5F9" />
    <text x="59" y="140" fill="#475569" font-size="11" font-weight="800">VB</text>
    <text x="86" y="139" fill="#0F172A" font-size="11" font-weight="800" font-family="system-ui, sans-serif">Source Audit</text>
    
    <rect x="55" y="162" width="105" height="6" rx="3" fill="#E2E8F0" />
    <rect x="55" y="174" width="85" height="6" rx="3" fill="#F1F5F9" />
    <rect x="55" y="186" width="95" height="6" rx="3" fill="#E2E8F0" />
    
    <rect x="55" y="208" width="105" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="107" y="223" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" font-family="system-ui, sans-serif">Forms &amp; OCX Controls</text>
  </g>

  <!-- Connection Line Left -> Center -->
  <path d="M 175 185 L 190 185" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Right Supporting Card: Target Database & API Replatforming -->
  <g filter="url(#aboutShadow)">
    <rect x="405" y="110" width="135" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="430" cy="135" r="14" fill="#ECFDF5" />
    <text x="424" y="140" fill="#059669" font-size="11" font-weight="800">SQL</text>
    <text x="451" y="139" fill="#0F172A" font-size="11" font-weight="800" font-family="system-ui, sans-serif">Modern DB</text>
    
    <rect x="420" y="162" width="105" height="6" rx="3" fill="#A7F3D0" />
    <rect x="420" y="174" width="85" height="6" rx="3" fill="#D1FAE5" />
    <rect x="420" y="186" width="95" height="6" rx="3" fill="#A7F3D0" />
    
    <rect x="420" y="208" width="105" height="24" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <text x="472" y="223" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="system-ui, sans-serif">REST &amp; SQL Server</text>
  </g>

  <!-- Connection Line Center -> Right -->
  <path d="M 390 185 L 405 185" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
</svg>
