<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" fill="none">
  <defs>
    <linearGradient id="sec1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="modernBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="15" y="15" width="550" height="350" rx="20" fill="url(#sec1Bg)" />
  <circle cx="480" cy="80" r="60" fill="#38BDF8" opacity="0.12" />
  <circle cx="100" cy="300" r="80" fill="#34D399" opacity="0.12" />

  <!-- Main Architecture Dashboard Window -->
  <g filter="url(#fShadow)">
    <rect x="65" y="55" width="450" height="270" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <path d="M 65 69 C 65 61.27 71.27 55 79 55 L 501 55 C 508.73 55 515 61.27 515 69 L 515 92 L 65 92 Z" fill="#F8FAFC" />
    <circle cx="85" cy="73.5" r="4" fill="#EF4444" />
    <circle cx="98" cy="73.5" r="4" fill="#F59E0B" />
    <circle cx="111" cy="73.5" r="4" fill="#10B981" />
    <rect x="195" y="65" width="190" height="17" rx="8" fill="#EDF2F7" />
    <text x="220" y="77" fill="#64748B" font-size="9" font-family="system-ui, sans-serif" font-weight="600">https://modern-app.enterprise.com</text>

    <!-- Side Navigation -->
    <rect x="65" y="92" width="100" height="233" fill="#F1F5F9" />
    <rect x="80" y="112" width="70" height="12" rx="4" fill="#0284C7" />
    <rect x="80" y="134" width="60" height="8" rx="4" fill="#CBD5E1" />
    <rect x="80" y="152" width="55" height="8" rx="4" fill="#CBD5E1" />
    <rect x="80" y="170" width="65" height="8" rx="4" fill="#CBD5E1" />
    <rect x="80" y="188" width="50" height="8" rx="4" fill="#CBD5E1" />

    <!-- Dashboard Content Area -->
    <!-- Metric 1: Automated Conversion Rate -->
    <rect x="180" y="108" width="155" height="74" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <text x="194" y="127" fill="#0369A1" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Code Modernization</text>
    <text x="194" y="156" fill="#0F172A" font-size="22" font-weight="900" font-family="system-ui, sans-serif">99.8%</text>
    <text x="270" y="156" fill="#10B981" font-size="10" font-weight="700" font-family="system-ui, sans-serif">↑ C# .NET</text>

    <!-- Metric 2: Performance Boost -->
    <rect x="350" y="108" width="150" height="74" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="364" y="127" fill="#047857" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Query Performance</text>
    <text x="364" y="156" fill="#0F172A" font-size="22" font-weight="900" font-family="system-ui, sans-serif">5.4x</text>
    <text x="424" y="156" fill="#059669" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Faster</text>

    <!-- Migration Pipeline Flow Chart -->
    <rect x="180" y="196" width="320" height="110" rx="10" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="194" y="214" fill="#6B21A8" font-size="10.5" font-weight="800" font-family="system-ui, sans-serif">VB6 to .NET Automated Migration Flow</text>

    <!-- Flow Steps -->
    <!-- Step 1 -->
    <rect x="195" y="228" width="80" height="64" rx="6" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" />
    <text x="205" y="246" fill="#7E22CE" font-size="9" font-weight="700" font-family="system-ui, sans-serif">1. AST Parse</text>
    <rect x="205" y="254" width="60" height="5" rx="2" fill="#E2E8F0" />
    <rect x="205" y="264" width="50" height="5" rx="2" fill="#F1F5F9" />
    <rect x="205" y="274" width="40" height="5" rx="2" fill="#E2E8F0" />

    <!-- Step 2 -->
    <path d="M 281 260 L 297 260 M 293 256 L 298 260 L 293 264" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
    <rect x="303" y="228" width="80" height="64" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" />
    <text x="313" y="246" fill="#0284C7" font-size="9" font-weight="700" font-family="system-ui, sans-serif">2. Refactor</text>
    <rect x="313" y="254" width="60" height="5" rx="2" fill="#BAE6FD" />
    <rect x="313" y="264" width="50" height="5" rx="2" fill="#E0F2FE" />
    <rect x="313" y="274" width="40" height="5" rx="2" fill="#BAE6FD" />

    <!-- Step 3 -->
    <path d="M 389 260 L 405 260 M 401 256 L 406 260 L 401 264" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    <rect x="411" y="228" width="75" height="64" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" />
    <text x="421" y="246" fill="#059669" font-size="9" font-weight="700" font-family="system-ui, sans-serif">3. Modernize</text>
    <rect x="421" y="254" width="55" height="5" rx="2" fill="#A7F3D0" />
    <rect x="421" y="264" width="45" height="5" rx="2" fill="#D1FAE5" />
    <rect x="421" y="274" width="35" height="5" rx="2" fill="#A7F3D0" />
  </g>

  <!-- Floating Badge -->
  <g filter="url(#fShadow)">
    <rect x="40" y="280" width="150" height="42" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="58" cy="301" r="10" fill="#0284C7" />
    <path d="M 54 301 L 57 304 L 62 298" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="75" y="297" fill="#0F172A" font-size="10" font-weight="800" font-family="system-ui, sans-serif">Enterprise Ready</text>
    <text x="75" y="310" fill="#64748B" font-size="8.5" font-family="system-ui, sans-serif">Windows 11 / Cloud Compatible</text>
  </g>
</svg>
