<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows for Depth -->
    <filter id="ipadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#005F96" flood-opacity="0.18"/>
    </filter>
    <filter id="floatingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="ipadBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="screenTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005F96"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- NO CONTAINER BOX - 100% TRANSPARENT CANVAS -->

  <!-- Floating Badge 1: Top Left - iPadOS Badge -->
  <g transform="translate(35, 45)" filter="url(#floatingShadow)">
    <rect x="0" y="0" width="115" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="8" y="7" width="28" height="28" rx="8" fill="#005F96"/>
    <path d="M16 14 H28 M22 14 V28 M17 28 H27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="73" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a" text-anchor="middle">iPadOS 18</text>
  </g>

  <!-- Floating Badge 2: Top Right - Apple Pencil & SwiftUI -->
  <g transform="translate(435, 40)" filter="url(#floatingShadow)">
    <rect x="0" y="0" width="130" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="23" cy="22" r="13" fill="#a855f7"/>
    <path d="M17 27 L27 17 M25 15 L29 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="80" y="22" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Apple Pencil</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Precision Input</text>
  </g>

  <!-- Floating Badge 3: Middle Right - Stage Manager / Multitasking -->
  <g transform="translate(445, 235)" filter="url(#floatingShadow)">
    <rect x="0" y="0" width="125" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="30" height="30" rx="8" fill="#10b981"/>
    <rect x="17" y="16" width="10" height="10" rx="2" fill="#ffffff"/>
    <rect x="29" y="16" width="5" height="16" rx="2" fill="#ffffff" opacity="0.7"/>
    <text x="82" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Split View</text>
    <text x="82" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Multitasking</text>
  </g>

  <!-- Floating Badge 4: Bottom Left - ProMotion 120Hz -->
  <g transform="translate(30, 315)" filter="url(#floatingShadow)">
    <rect x="0" y="0" width="130" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="8" width="30" height="30" rx="8" fill="url(#violetGrad)"/>
    <text x="25" y="28" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">120</text>
    <text x="82" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">ProMotion</text>
    <text x="82" y="36" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Ultra Fluid UI</text>
  </g>

  <!-- MAIN LANDSCAPE iPAD PRO TABLET MOCKUP -->
  <g transform="translate(140, 65)" filter="url(#ipadShadow)">
    <!-- iPad Outer Bezel Body (Landscape Mode) -->
    <rect x="0" y="0" width="320" height="230" rx="22" fill="url(#ipadBezel)" stroke="#475569" stroke-width="3"/>

    <!-- Inner Screen Display -->
    <rect x="10" y="10" width="300" height="210" rx="14" fill="#f8fafc"/>

    <!-- Screen Front Camera Dot -->
    <circle cx="160" cy="5" r="2.5" fill="#64748b"/>

    <!-- iPadOS Top Header Bar / Status Bar -->
    <path d="M10 10 H310 V34 H10 Z" fill="url(#screenTopBar)"/>
    <text x="25" y="26" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">Firevy iPad OS</text>
    <text x="285" y="26" font-family="sans-serif" font-weight="600" font-size="10" fill="#e0f2fe" text-anchor="end">9:41 AM</text>

    <!-- App Dashboard Layout inside iPad Screen -->
    <!-- Left Sidebar Menu -->
    <rect x="20" y="44" width="70" height="166" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="28" y="54" width="54" height="20" rx="6" fill="#005F96"/>
    <text x="55" y="68" font-family="sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Dashboard</text>

    <rect x="28" y="80" width="54" height="18" rx="6" fill="#f1f5f9"/>
    <text x="55" y="93" font-family="sans-serif" font-weight="500" font-size="9" fill="#64748b" text-anchor="middle">Analytics</text>

    <rect x="28" y="104" width="54" height="18" rx="6" fill="#f1f5f9"/>
    <text x="55" y="117" font-family="sans-serif" font-weight="500" font-size="9" fill="#64748b" text-anchor="middle">Projects</text>

    <rect x="28" y="128" width="54" height="18" rx="6" fill="#f1f5f9"/>
    <text x="55" y="141" font-family="sans-serif" font-weight="500" font-size="9" fill="#64748b" text-anchor="middle">Settings</text>

    <!-- Main Content Area Right -->
    <!-- Card 1: Revenue Chart Widget -->
    <rect x="98" y="44" width="202" height="85" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="62" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b">Enterprise Analytics</text>
    <text x="110" y="78" font-family="sans-serif" font-weight="900" font-size="16" fill="#005F96">$128.4K</text>
    <!-- Smooth Area Chart Wave -->
    <path d="M180 110 Q200 80, 220 95 T260 70 T290 85 V115 H180 Z" fill="#005F96" opacity="0.15"/>
    <path d="M180 110 Q200 80, 220 95 T260 70 T290 85" fill="none" stroke="#005F96" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Card 2: Apple Pencil Canvas Line Overlay -->
    <rect x="98" y="136" width="96" height="74" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="106" y="152" font-family="sans-serif" font-weight="700" font-size="10" fill="#7c3aed">Design Canvas</text>
    <!-- Drawn Line -->
    <path d="M106 175 Q125 160 145 185 T180 165" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Card 3: Status Pill -->
    <rect x="202" y="136" width="98" height="74" rx="10" fill="url(#emeraldGrad)"/>
    <text x="251" y="166" font-family="sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">iPad Pro M4</text>
    <text x="251" y="182" font-family="sans-serif" font-weight="500" font-size="9" fill="#e0f2fe" text-anchor="middle">Native Performance</text>
  </g>

  <!-- APPLE PENCIL GRAPHIC (Overlay resting dynamically diagonally on top) -->
  <g transform="translate(320, 230) rotate(-25)" filter="url(#floatingShadow)">
    <!-- Pencil Body -->
    <rect x="0" y="0" width="160" height="12" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Metal Band / Cap -->
    <rect x="142" y="0" width="18" height="12" rx="2" fill="#94a3b8"/>
    <!-- Pencil Tip -->
    <polygon points="0,0 -16,6 0,12" fill="#cbd5e1"/>
    <polygon points="-10,4 -16,6 -10,8" fill="#475569"/>
  </g>
</svg>
