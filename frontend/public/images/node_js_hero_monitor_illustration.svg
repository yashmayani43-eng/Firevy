<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shadow filters for badges and monitor -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
    <linearGradient id="standGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- 1. GEAR OUTLINES IN BACKGROUND -->
  <g stroke="#008BAA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Top Right Big Gear -->
    <path d="M 430,90 A 40,40 0 1,0 430,90.1" stroke-dasharray="6 6" />
    <circle cx="430" cy="90" r="32" />
    <circle cx="430" cy="90" r="16" fill="none" />
    <path d="M 430,42 V 58 M 430,122 V 138 M 382,90 H 398 M 462,90 H 478 M 396,56 L 407,67 M 453,113 L 464,124 M 396,124 L 407,113 M 453,67 L 464,56" />

    <!-- Bottom Left Gear -->
    <circle cx="170" cy="380" r="36" stroke-dasharray="4 4" />
    <circle cx="170" cy="380" r="20" fill="none" />
    <path d="M 170,336 V 348 M 170,412 V 424 M 126,380 H 138 M 202,380 H 214" />

    <!-- Right Gear -->
    <circle cx="560" cy="240" r="42" stroke-dasharray="5 5" />
    <circle cx="560" cy="240" r="22" fill="none" />
    <path d="M 560,190 V 204 M 560,276 V 290 M 510,240 H 524 M 596,240 H 610" />
  </g>

  <!-- 2. DESKTOP MONITOR -->
  <g filter="url(#shadow)">
    <!-- Monitor Stand Base -->
    <ellipse cx="350" cy="465" rx="65" ry="12" fill="#94A3B8" />
    <path d="M 320,463 C 320,463 335,395 338,380 H 362 C 365,395 380,463 380,463 Z" fill="url(#standGradient)" />

    <!-- Monitor Outer Frame (Navy Dark) -->
    <rect x="130" y="120" width="440" height="270" rx="14" fill="#0F172A" />
    <!-- Monitor Inner Screen (Clean White) -->
    <rect x="138" y="128" width="424" height="254" rx="8" fill="#FFFFFF" />

    <!-- Screen Header Bar -->
    <rect x="138" y="128" width="424" height="30" rx="8" fill="#F1F5F9" />
    <rect x="138" y="150" width="424" height="8" fill="#F1F5F9" />
    <!-- 3 Window Control Buttons -->
    <circle cx="156" cy="143" r="4.5" fill="#EF4444" />
    <circle cx="170" cy="143" r="4.5" fill="#F59E0B" />
    <circle cx="184" cy="143" r="4.5" fill="#10B981" />

    <!-- 3. CODE LINES ON SCREEN (LEFT SIDE) -->
    <g fill="#008BAA" opacity="0.85">
      <rect x="160" y="175" width="140" height="7" rx="3.5" fill="#006E90" />
      <rect x="160" y="193" width="90" height="6" rx="3" fill="#38BDF8" />
      <rect x="160" y="209" width="180" height="6" rx="3" fill="#0284C7" />
      <rect x="175" y="225" width="120" height="6" rx="3" fill="#008BAA" />
      <rect x="175" y="241" width="150" height="6" rx="3" fill="#38BDF8" />
      <rect x="190" y="257" width="100" height="6" rx="3" fill="#0284C7" />
      <rect x="160" y="273" width="130" height="6" rx="3" fill="#006E90" />
      <rect x="160" y="289" width="170" height="6" rx="3" fill="#38BDF8" />
      <rect x="175" y="305" width="110" height="6" rx="3" fill="#008BAA" />
      <rect x="160" y="321" width="140" height="6" rx="3" fill="#0284C7" />
      <rect x="160" y="337" width="80" height="6" rx="3" fill="#38BDF8" />
    </g>

    <!-- 4. NODE.JS LOGO IN CIRCLE (RIGHT SIDE OF SCREEN) -->
    <g>
      <!-- Circle Background for Node.js -->
      <circle cx="445" cy="245" r="54" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

      <!-- Node.js Hexagon Icon & Text -->
      <path d="M 445,212 L 464,223 V 245 L 445,256 L 426,245 V 223 Z" fill="#339933" />
      <path d="M 445,212 V 234 M 445,234 L 464,223 M 445,234 L 426,223 M 445,234 V 256" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text x="445" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#339933" letter-spacing="-0.5">node</text>
      <text x="473" y="274" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#339933">.js</text>
    </g>
  </g>

  <!-- 5. FLOATING TECH BADGES -->

  <!-- Top Right Badge: HTML 5 -->
  <g transform="translate(525, 110)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    <path d="M 18,14 L 38,14 L 36,36 L 28,40 L 20,36 Z" fill="#E0F2FE" />
    <text x="28" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#0284C7">5</text>
    <text x="28" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7" fill="#0369A1" letter-spacing="0.5">HTML5</text>
  </g>

  <!-- Left Badge: JS (JavaScript) -->
  <g transform="translate(85, 195)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    <text x="27" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0284C7">JS</text>
    <text x="27" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" fill="#0369A1">JavaScript</text>
  </g>

  <!-- Bottom Left Badge: git -->
  <g transform="translate(118, 335)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    <circle cx="21" cy="20" r="3.5" fill="#0284C7" />
    <circle cx="31" cy="20" r="3.5" fill="#0284C7" />
    <circle cx="26" cy="34" r="3.5" fill="#0284C7" />
    <path d="M 21,20 V 28 C 21,31 26,31 26,34 M 31,20 V 25 C 31,28 26,28 26,34" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="26" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7" fill="#0369A1">git</text>
  </g>

  <!-- Bottom Right Badge: CSS3 -->
  <g transform="translate(520, 305)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    <path d="M 17,14 L 37,14 L 35,36 L 27,40 L 19,36 Z" fill="#E0F2FE" />
    <text x="27" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#0284C7">3</text>
    <text x="27" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7" fill="#0369A1" letter-spacing="0.5">CSS3</text>
  </g>
</svg>
