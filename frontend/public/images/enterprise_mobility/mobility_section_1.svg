<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" fill="none">
  <defs>
    <linearGradient id="mobSec1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="cardSh" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect x="15" y="15" width="550" height="350" rx="20" fill="url(#mobSec1Bg)" />

  <!-- Multi-Device Enterprise Network Visual -->
  <!-- Center Main Hub -->
  <g filter="url(#cardSh)">
    <rect x="140" y="50" width="300" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Header -->
    <path d="M 140 64 C 140 56.27 146.27 50 154 50 L 426 50 C 433.73 50 440 56.27 440 64 L 440 85 L 140 85 Z" fill="#F8FAFC" />
    <circle cx="158" cy="67.5" r="4" fill="#EF4444" />
    <circle cx="170" cy="67.5" r="4" fill="#F59E0B" />
    <circle cx="182" cy="67.5" r="4" fill="#10B981" />
    <text x="290" y="71" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700" font-family="system-ui, sans-serif">Enterprise Mobility Management (EMM)</text>

    <!-- Center Content: 4 Quadrants -->
    <!-- Q1: Device Fleets -->
    <rect x="155" y="98" width="125" height="65" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <text x="168" y="117" fill="#0369A1" font-size="9" font-weight="700">Managed Endpoints</text>
    <text x="168" y="142" fill="#0F172A" font-size="20" font-weight="900">50,000+</text>
    <text x="245" y="142" fill="#10B981" font-size="9" font-weight="700">Online</text>

    <!-- Q2: BYOD Security -->
    <rect x="295" y="98" width="130" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="308" y="117" fill="#047857" font-size="9" font-weight="700">BYOD Container</text>
    <text x="308" y="142" fill="#0F172A" font-size="20" font-weight="900">AES-256</text>
    <text x="390" y="142" fill="#059669" font-size="9" font-weight="700">Secured</text>

    <!-- Bottom Flow: App Distribution & Micro-VPN -->
    <rect x="155" y="175" width="270" height="60" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="168" y="195" fill="#6B21A8" font-size="9" font-weight="700">Private Enterprise App Store &amp; Per-App VPN</text>
    
    <rect x="168" y="206" width="60" height="20" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" />
    <text x="198" y="220" text-anchor="middle" fill="#7E22CE" font-size="8" font-weight="700">iOS Native</text>

    <rect x="235" y="206" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" />
    <text x="270" y="220" text-anchor="middle" fill="#7E22CE" font-size="8" font-weight="700">Android Work</text>

    <rect x="312" y="206" width="65" height="20" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" />
    <text x="344.5" y="220" text-anchor="middle" fill="#7E22CE" font-size="8" font-weight="700">Cross-Platform</text>

    <rect x="384" y="206" width="35" height="20" rx="4" fill="#6B21A8" />
    <text x="401.5" y="220" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="800">Auto</text>
  </g>

  <!-- Left Satellite: Field Mobility & Telemetry -->
  <g filter="url(#cardSh)">
    <rect x="40" y="190" width="130" height="135" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="65" cy="215" r="14" fill="#E0F2FE" />
    <path d="M 60 215 L 63 218 L 70 211" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    <text x="86" y="219" fill="#0F172A" font-size="10.5" font-weight="800" font-family="system-ui, sans-serif">Field Telemetry</text>
    <rect x="52" y="240" width="105" height="6" rx="3" fill="#E2E8F0" />
    <rect x="52" y="252" width="85" height="6" rx="3" fill="#F1F5F9" />
    <rect x="52" y="264" width="95" height="6" rx="3" fill="#E2E8F0" />
    <rect x="52" y="284" width="105" height="26" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <text x="104.5" y="300" text-anchor="middle" fill="#047857" font-size="8.5" font-weight="700">Offline-First Sync</text>
  </g>

  <!-- Right Satellite: Enterprise ERP & Cloud Sync -->
  <g filter="url(#cardSh)">
    <rect x="410" y="190" width="130" height="135" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="435" cy="215" r="14" fill="#FEF3C7" />
    <path d="M 435 208 L 442 215 L 435 222" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="456" y="219" fill="#0F172A" font-size="10.5" font-weight="800" font-family="system-ui, sans-serif">Cloud Backend</text>
    <rect x="422" y="240" width="105" height="6" rx="3" fill="#FDE68A" />
    <rect x="422" y="252" width="85" height="6" rx="3" fill="#FEF3C7" />
    <rect x="422" y="264" width="95" height="6" rx="3" fill="#FDE68A" />
    <rect x="422" y="284" width="105" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="474.5" y="300" text-anchor="middle" fill="#1D4ED8" font-size="8.5" font-weight="700">REST &amp; GraphQL</text>
  </g>

  <!-- Connecting dashed lines -->
  <path d="M 125 190 L 160 160" stroke="#005F96" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 455 190 L 420 160" stroke="#005F96" stroke-width="2" stroke-dasharray="3 3" />
</svg>
