<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="heroMobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FB" />
      <stop offset="100%" stop-color="#E2F1F9" />
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005F96" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="mDrop" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Container -->
  <rect x="20" y="20" width="560" height="360" rx="24" fill="url(#heroMobBg)" />
  <circle cx="300" cy="200" r="160" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />

  <!-- Center Floating Tablet / Display Screen -->
  <g filter="url(#mDrop)">
    <rect x="180" y="60" width="280" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <!-- Browser Header Bar -->
    <path d="M 180 74 C 180 66.27 186.27 60 194 60 L 446 60 C 453.73 60 460 66.27 460 74 L 460 88 L 180 88 Z" fill="#F8FAFC" />
    <circle cx="196" cy="74" r="3.5" fill="#EF4444" />
    <circle cx="207" cy="74" r="3.5" fill="#F59E0B" />
    <circle cx="218" cy="74" r="3.5" fill="#10B981" />
    <rect x="250" y="68" width="140" height="12" rx="6" fill="#EDF2F7" />

    <!-- Tablet Inner Content: Analytics & Enterprise Dashboard -->
    <rect x="198" y="102" width="75" height="42" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <text x="208" y="118" fill="#0369A1" font-size="8.5" font-weight="700" font-family="system-ui, sans-serif">Active Devices</text>
    <text x="208" y="136" fill="#0F172A" font-size="16" font-weight="900" font-family="system-ui, sans-serif">14.8k</text>

    <rect x="283" y="102" width="75" height="42" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="293" y="118" fill="#047857" font-size="8.5" font-weight="700" font-family="system-ui, sans-serif">Sync Health</text>
    <text x="293" y="136" fill="#059669" font-size="16" font-weight="900" font-family="system-ui, sans-serif">99.9%</text>

    <rect x="368" y="102" width="75" height="42" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="378" y="118" fill="#6B21A8" font-size="8.5" font-weight="700" font-family="system-ui, sans-serif">Security Policy</text>
    <text x="378" y="136" fill="#7E22CE" font-size="16" font-weight="900" font-family="system-ui, sans-serif">Zero-Trust</text>

    <!-- Chart simulation -->
    <path d="M 200 205 C 230 185, 270 215, 310 175 C 350 195, 390 160, 440 180" stroke="#005F96" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 200 205 C 230 185, 270 215, 310 175 C 350 195, 390 160, 440 180 L 440 230 L 200 230 Z" fill="#005F96" fill-opacity="0.08" />
  </g>

  <!-- Foreground Modern Smartphone (Enterprise Mobile App) -->
  <g filter="url(#mDrop)">
    <rect x="90" y="120" width="135" height="240" rx="24" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <rect x="95" y="125" width="125" height="230" rx="20" fill="#FFFFFF" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="135" y="132" width="45" height="6" rx="3" fill="#0F172A" />
    
    <!-- Phone App Header -->
    <rect x="105" y="148" width="105" height="24" rx="6" fill="#005F96" />
    <text x="120" y="164" fill="#FFFFFF" font-size="9" font-weight="800" font-family="system-ui, sans-serif">Enterprise Portal</text>
    
    <!-- Quick Action Grid on Mobile -->
    <rect x="105" y="180" width="48" height="44" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <circle cx="129" cy="196" r="8" fill="#0284C7" />
    <text x="129" y="217" text-anchor="middle" fill="#0369A1" font-size="7.5" font-weight="700">Inventory</text>

    <rect x="162" y="180" width="48" height="44" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle cx="186" cy="196" r="8" fill="#10B981" />
    <text x="186" y="217" text-anchor="middle" fill="#047857" font-size="7.5" font-weight="700">Field Ops</text>

    <rect x="105" y="232" width="48" height="44" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <circle cx="129" cy="248" r="8" fill="#D97706" />
    <text x="129" y="269" text-anchor="middle" fill="#92400E" font-size="7.5" font-weight="700">Approvals</text>

    <rect x="162" y="232" width="48" height="44" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <circle cx="186" cy="248" r="8" fill="#9333EA" />
    <text x="186" y="269" text-anchor="middle" fill="#6B21A8" font-size="7.5" font-weight="700">CRM Sync</text>

    <!-- Mobile Biometric Verification Badge -->
    <rect x="105" y="286" width="105" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="120" cy="302" r="7" fill="#10B981" />
    <path d="M 117 302 L 119.5 304.5 L 123.5 299.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <text x="132" y="302" fill="#0F172A" font-size="8" font-weight="700">SSO &amp; MDM Active</text>
    <text x="132" y="311" fill="#64748B" font-size="7">Knox / Apple DEP</text>

    <!-- Home indicator bar -->
    <rect x="138" y="347" width="40" height="3" rx="1.5" fill="#94A3B8" />
  </g>

  <!-- Cloud Sync Satellite Badge Top Right -->
  <g filter="url(#mDrop)">
    <rect x="420" y="230" width="140" height="90" rx="14" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <circle cx="445" cy="255" r="16" fill="url(#brandBlue)" />
    <!-- Lock / Shield Vector -->
    <path d="M 445 247 L 452 250 L 452 256 C 452 260.5 449 264.5 445 266 C 441 264.5 438 260.5 438 256 L 438 250 Z" fill="#FFFFFF" />
    <text x="470" y="253" fill="#0F172A" font-size="11" font-weight="800" font-family="system-ui, sans-serif">Enterprise MDM</text>
    <text x="470" y="265" fill="#64748B" font-size="9" font-family="system-ui, sans-serif">Device Encryption</text>
    
    <rect x="435" y="285" width="110" height="22" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <text x="490" y="299" text-anchor="middle" fill="#047857" font-size="8.5" font-weight="700">iOS &amp; Android Unified</text>
  </g>

  <!-- Wireless Connection Signals -->
  <path d="M 230 200 C 270 200, 310 180, 340 180" stroke="#005F96" stroke-width="2" stroke-dasharray="4 4" />
</svg>
