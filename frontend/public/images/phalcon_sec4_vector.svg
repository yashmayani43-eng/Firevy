<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" fill="none">
  <!-- Floating Background Elements: Phalcon Logo Card & Clock -->
  <g transform="translate(230, 30)">
    <rect x="0" y="0" width="55" height="42" rx="4" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
    <!-- Phalcon Logo -->
    <path d="M 16 10 C 24 5 34 10 40 22 C 32 25 22 22 16 10 Z" fill="#10B981" />
    <path d="M 18 12 C 24 16 30 25 34 30 C 24 28 20 22 18 12 Z" fill="#059669" />
    <path d="M 30 20 C 36 17 42 20 44 26 C 38 28 35 24 30 20 Z" fill="#1E293B" />
  </g>

  <!-- Floating Wall Clock (Top Right) -->
  <g transform="translate(370, 60)">
    <circle cx="15" cy="15" r="14" fill="#BAE6FD" opacity="0.6" />
    <line x1="15" y1="15" x2="15" y2="7" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="15" x2="21" y2="15" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Conference Table (Center Navy Blue Top with Legs) -->
  <rect x="180" y="220" width="230" height="10" rx="2" fill="#0F172A" />
  <rect x="235" y="230" width="10" height="70" fill="#0F172A" />
  <rect x="345" y="230" width="10" height="70" fill="#0F172A" />
  <rect x="210" y="295" width="60" height="5" rx="2" fill="#0F172A" />
  <rect x="320" y="295" width="60" height="5" rx="2" fill="#0F172A" />

  <!-- Person 1: Male Sitting Left (Blue Shirt & Chair) -->
  <g transform="translate(130, 160)">
    <!-- Chair Back -->
    <rect x="-10" y="40" width="14" height="80" rx="3" fill="#64748B" />
    <path d="M -10 120 L 10 120 L -5 140 Z" fill="#64748B" />

    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="11" fill="#FED7AA" />
    <path d="M 10 12 C 20 4 30 8 32 20 C 22 22 12 18 10 12 Z" fill="#1E293B" />

    <!-- Torso (Sky Blue Shirt) -->
    <path d="M 5 40 Q 20 32 35 40 L 40 85 L 10 85 Z" fill="#0284C7" />
    <!-- Tie -->
    <polygon points="20,40 23,60 20,65 17,60" fill="#0369A1" />

    <!-- Legs (Dark Pants) -->
    <path d="M 10 85 L 45 85 L 60 135 L 45 135 L 30 98 L 10 98 Z" fill="#1E293B" />

    <!-- Laptop open on table -->
    <polygon points="45,52 80,52 85,62 40,62" fill="#0F172A" />
  </g>

  <!-- Person 2: Male Standing Middle (Blue Sweater & Black Pants) -->
  <g transform="translate(265, 125)">
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="11" fill="#FED7AA" />
    <path d="M 10 14 C 20 6 30 8 32 18 C 24 20 14 18 10 14 Z" fill="#1E293B" />

    <!-- Torso (Blue Shirt) -->
    <path d="M 5 40 Q 20 32 35 40 L 40 90 L 5 90 Z" fill="#0284C7" />
    <!-- Arms holding tablet/clipboard -->
    <path d="M 10 50 L 30 65 L 15 75 Z" fill="#FED7AA" />
    <rect x="20" y="60" width="18" height="22" rx="2" fill="#38BDF8" stroke="#0284C7" stroke-width="1" />

    <!-- Legs (Dark Pants) -->
    <rect x="8" y="90" width="11" height="85" fill="#1E293B" />
    <rect x="22" y="90" width="11" height="85" fill="#1E293B" />
    <!-- Shoes -->
    <rect x="4" y="170" width="16" height="6" rx="2" fill="#0F172A" />
    <rect x="22" y="170" width="16" height="6" rx="2" fill="#0F172A" />
  </g>

  <!-- Person 3: Female Sitting Right (Yellow Top, Dark Hair, Blue Pants) -->
  <g transform="translate(355, 175)">
    <!-- Chair Back -->
    <rect x="45" y="30" width="14" height="75" rx="3" fill="#38BDF8" opacity="0.6" />

    <!-- Head & Long Dark Hair -->
    <path d="M 5 8 C -10 20 -10 50 5 65 C 15 65 30 65 35 45 C 40 20 25 5 5 8 Z" fill="#1E293B" />
    <circle cx="20" cy="20" r="10" fill="#FED7AA" />

    <!-- Torso (Yellow Top) -->
    <path d="M 5 38 Q 20 32 35 38 L 40 75 L 10 75 Z" fill="#F59E0B" />
    <!-- Arms typing -->
    <path d="M 10 48 L -15 62 L 0 70 Z" fill="#FED7AA" />

    <!-- Legs (Crossed Dark Pants) -->
    <path d="M 10 75 L -20 120 L -35 120 L -5 75 Z" fill="#1E293B" />

    <!-- Laptop on table -->
    <polygon points="-25,40 15,40 20,48 -30,48" fill="#0F172A" />
  </g>

  <!-- Decorative Plants at Sides -->
  <g transform="translate(130, 260)">
    <path d="M 10 40 C -5 20 0 0 10 40 Z" fill="#0284C7" />
    <path d="M 10 40 C 25 20 20 0 10 40 Z" fill="#38BDF8" />
    <path d="M 10 40 C 10 10 10 0 10 40 Z" fill="#0369A1" />
  </g>
  <g transform="translate(435, 260)">
    <path d="M 10 40 C -5 20 0 0 10 40 Z" fill="#0284C7" />
    <path d="M 10 40 C 25 20 20 0 10 40 Z" fill="#38BDF8" />
    <path d="M 10 40 C 10 10 10 0 10 40 Z" fill="#0369A1" />
  </g>

  <!-- Base Ground Line -->
  <line x1="120" y1="300" x2="470" y2="300" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
</svg>
