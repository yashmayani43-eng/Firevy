<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%" fill="none">
  <!-- 1. FLOATING WORKSPACE DASHBOARD & CODE PANELS (Top Center) -->
  <g transform="translate(250, 20)">
    <!-- Code Window Card (White Card with Sky Blue border) -->
    <rect x="0" y="0" width="200" height="115" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" />
    <!-- Window Header -->
    <path d="M 0,10 C 0,4.5 4.5,0 10,0 H 190 C 195.5,0 200,4.5 200,10 V 24 H 0 Z" fill="#F0F9FF" />
    <circle cx="15" cy="12" r="3" fill="#EF4444" />
    <circle cx="27" cy="12" r="3" fill="#F59E0B" />
    <circle cx="39" cy="12" r="3" fill="#10B981" />
    <!-- Code Skeleton Lines -->
    <rect x="18" y="34" width="65" height="5" rx="2.5" fill="#0284C7" />
    <rect x="18" y="46" width="110" height="4" rx="2" fill="#38BDF8" />
    <rect x="26" y="56" width="85" height="4" rx="2" fill="#93C5FD" />
    <rect x="26" y="66" width="70" height="4" rx="2" fill="#93C5FD" />
    <rect x="18" y="76" width="95" height="4" rx="2" fill="#38BDF8" />
    <rect x="18" y="88" width="55" height="4" rx="2" fill="#CBD5E1" />
    <!-- Purple Gear with Code Icon -->
    <circle cx="160" cy="68" r="22" fill="#818CF8" />
    <text x="160" y="73" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">&lt;/&gt;</text>
  </g>

  <!-- Floating Badge 1: UI/UX Team Badge (Left) -->
  <g transform="translate(90, 60)">
    <rect x="0" y="0" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <circle cx="22" cy="22" r="12" fill="#38BDF8" />
    <text x="22" y="26" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">UX</text>
    <text x="72" y="20" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#0F172A">UI/UX Team</text>
    <text x="72" y="32" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="9" fill="#0284C7">Design System</text>
  </g>

  <!-- Floating Badge 2: Agile Sprint Badge (Right) -->
  <g transform="translate(490, 55)">
    <rect x="0" y="0" width="125" height="44" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <circle cx="22" cy="22" r="12" fill="#10B981" />
    <path d="M 16 22 L 20 26 L 28 17" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="75" y="20" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#0F172A">Agile Sprint</text>
    <text x="75" y="32" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="9" fill="#10B981">Completed 100%</text>
  </g>

  <!-- 2. CENTRAL DESK & WORKSPACE (Main Scene) -->
  <g transform="translate(130, 180)">
    <!-- Desk Surface (White Top with Sky Blue Edge Rim) -->
    <rect x="40" y="100" width="370" height="20" rx="4" fill="#0284C7" />
    <rect x="35" y="90" width="380" height="12" rx="3" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <!-- Desk Legs -->
    <rect x="65" y="120" width="14" height="90" rx="3" fill="#0369A1" />
    <rect x="370" y="120" width="14" height="90" rx="3" fill="#0369A1" />

    <!-- Laptops & Coffee Mugs on Desk -->
    <!-- Laptop 1 (Left - Developer) -->
    <rect x="75" y="60" width="55" height="32" rx="4" fill="#1E293B" />
    <rect x="78" y="63" width="49" height="26" rx="2" fill="#38BDF8" />
    <rect x="65" y="90" width="75" height="3" rx="1.5" fill="#475569" />

    <!-- Laptop 2 (Center - Lead Engineer) -->
    <rect x="195" y="52" width="65" height="40" rx="4" fill="#0F172A" />
    <rect x="199" y="56" width="57" height="32" rx="2" fill="#E0F2FE" />
    <!-- Code snippet on screen -->
    <rect x="205" y="62" width="25" height="3" rx="1" fill="#0284C7" />
    <rect x="205" y="68" width="40" height="3" rx="1" fill="#38BDF8" />
    <rect x="205" y="74" width="30" height="3" rx="1" fill="#0284C7" />
    <rect x="185" y="90" width="85" height="3" rx="1.5" fill="#334155" />

    <!-- Laptop 3 (Right - QA Lead) -->
    <rect x="320" y="60" width="55" height="32" rx="4" fill="#1E293B" />
    <rect x="323" y="63" width="49" height="26" rx="2" fill="#38BDF8" />
    <rect x="310" y="90" width="75" height="3" rx="1.5" fill="#475569" />

    <!-- Coffee Cups on Desk -->
    <circle cx="150" cy="85" r="4.5" fill="#0284C7" />
    <circle cx="150" cy="85" r="3" fill="#FFFFFF" />
    <circle cx="295" cy="85" r="4.5" fill="#0284C7" />
    <circle cx="295" cy="85" r="3" fill="#FFFFFF" />
  </g>

  <!-- 3. FOUR DIVERSE TEAM MEMBERS WORKING TOGETHER -->
  <!-- TEAM MEMBER 1: Female UI/UX Designer (Left Side) -->
  <g transform="translate(160, 170)">
    <!-- Chair Backrest (Sky Blue) -->
    <rect x="10" y="30" width="36" height="50" rx="6" fill="#38BDF8" />
    <rect x="25" y="80" width="6" height="35" fill="#0284C7" />
    <!-- Body (Teal/Cyan Shirt) -->
    <path d="M 8,50 C 8,35 20,30 30,30 C 40,30 52,35 52,50 V 105 H 8 Z" fill="#0EA5E9" />
    <path d="M 42,45 Q 65,70 80,72" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Head & Hair -->
    <circle cx="30" cy="18" r="13" fill="#FDBA74" />
    <path d="M 18,15 C 18,0 42,0 42,15 C 44,28 30,32 24,30 Z" fill="#0F172A" />
    <circle cx="18" cy="22" r="5" fill="#0F172A" />
  </g>

  <!-- TEAM MEMBER 2: Male Lead Software Engineer (Center-Left) -->
  <g transform="translate(280, 155)">
    <!-- Chair Backrest (Dark Blue) -->
    <rect x="14" y="30" width="42" height="55" rx="6" fill="#0284C7" />
    <rect x="32" y="85" width="6" height="35" fill="#0369A1" />
    <!-- Body (Amber/Yellow Sweater) -->
    <path d="M 10,48 C 10,32 25,25 35,25 C 45,25 60,32 60,48 V 110 H 10 Z" fill="#F59E0B" />
    <!-- Arms -->
    <path d="M 20,48 Q 45,72 65,75" stroke="#FDBA74" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 50,48 Q 65,72 85,75" stroke="#FDBA74" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Head & Glasses -->
    <circle cx="35" cy="14" r="14" fill="#FDBA74" />
    <path d="M 22,12 C 22,0 48,0 48,12 C 40,8 30,8 22,12 Z" fill="#0F172A" />
    <rect x="27" y="11" width="8" height="6" rx="1" fill="none" stroke="#0F172A" stroke-width="1.5" />
    <rect x="37" y="11" width="8" height="6" rx="1" fill="none" stroke="#0F172A" stroke-width="1.5" />
    <line x1="35" y1="14" x2="37" y2="14" stroke="#0F172A" stroke-width="1.5" />
  </g>

  <!-- TEAM MEMBER 3: Female Senior QA Engineer (Center-Right) -->
  <g transform="translate(390, 170)">
    <!-- Chair Backrest (Sky Blue) -->
    <rect x="10" y="30" width="36" height="50" rx="6" fill="#38BDF8" />
    <rect x="25" y="80" width="6" height="35" fill="#0284C7" />
    <!-- Body (Pink Top) -->
    <path d="M 8,50 C 8,35 20,30 30,30 C 40,30 52,35 52,50 V 105 H 8 Z" fill="#EC4899" />
    <path d="M 18,45 Q -5,70 -20,72" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Head & Hair -->
    <circle cx="30" cy="18" r="13" fill="#FDBA74" />
    <path d="M 18,15 C 18,2 42,2 42,15 C 40,25 36,26 30,26 Z" fill="#334155" />
  </g>

  <!-- TEAM MEMBER 4: Male Product Manager (Right Side Standing) -->
  <g transform="translate(510, 160)">
    <!-- Body (Dark Blue Blazer & White Shirt) -->
    <path d="M 10,50 C 10,35 22,30 32,30 C 42,30 54,35 54,50 V 130 H 10 Z" fill="#0F172A" />
    <path d="M 26,30 L 38,30 L 32,70 Z" fill="#FFFFFF" />
    <path d="M 30,45 L 34,45 L 33,65 L 31,65 Z" fill="#0284C7" />
    <!-- Legs -->
    <rect x="16" y="130" width="12" height="70" fill="#334155" />
    <rect x="36" y="130" width="12" height="70" fill="#334155" />
    <ellipse cx="22" cy="202" rx="9" ry="4" fill="#0F172A" />
    <ellipse cx="42" cy="202" rx="9" ry="4" fill="#0F172A" />
    <!-- Arm pointing towards team -->
    <path d="M 14,48 L -15,70 L -10,75 L 18,55 Z" fill="#0F172A" />
    <circle cx="-14" cy="72" r="4" fill="#FDBA74" />
    <!-- Head & Hair -->
    <circle cx="32" cy="16" r="14" fill="#FDBA74" />
    <path d="M 18,14 C 18,0 46,0 46,14 C 40,8 28,8 18,14 Z" fill="#0F172A" />
  </g>

  <!-- 4. POTTED OFFICE PLANTS & BASE FLOOR LINE -->
  <!-- Left Potted Plant -->
  <g transform="translate(70, 240)">
    <path d="M 25,70 L 45,70 L 40,110 L 30,110 Z" fill="#0F172A" />
    <path d="M 35,70 C 10,40 0,10 30,0 C 50,30 40,60 35,70 Z" fill="#0284C7" />
    <path d="M 35,70 C 60,40 70,10 40,0 C 20,30 30,60 35,70 Z" fill="#38BDF8" />
  </g>

  <!-- Right Potted Plant -->
  <g transform="translate(600, 250)">
    <path d="M 25,60 L 45,60 L 40,100 L 30,100 Z" fill="#0F172A" />
    <path d="M 35,60 C 10,30 0,0 30,-10 C 50,20 40,50 35,60 Z" fill="#0284C7" />
    <path d="M 35,60 C 60,30 70,0 40,-10 C 20,20 30,50 35,60 Z" fill="#38BDF8" />
  </g>

  <!-- Baseline Floor -->
  <line x1="50" y1="360" x2="650" y2="360" stroke="#0284C7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
