<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Shadows and Gradients -->
    <filter id="laptopShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f2b48" flood-opacity="0.12" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="screenBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234b6e" />
      <stop offset="100%" stop-color="#16344f" />
    </linearGradient>
    <linearGradient id="laptopBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d3f5e" />
      <stop offset="100%" stop-color="#132a40" />
    </linearGradient>
  </defs>

  <!-- Laptop Base Shadow -->
  <ellipse cx="300" cy="382" rx="230" ry="14" fill="#0f2b48" opacity="0.12" />

  <g filter="url(#laptopShadow)">
    <!-- ========================================== -->
    <!-- LAPTOP SCREEN OUTER BEZEL                  -->
    <!-- ========================================== -->
    <rect x="90" y="30" width="420" height="280" rx="14" fill="url(#screenBezelGrad)" />
    
    <!-- Camera Dot / Indicator -->
    <circle cx="300" cy="42" r="2.5" fill="#486e91" />

    <!-- LAPTOP DISPLAY INNER SCREEN (White Canvas) -->
    <rect x="104" y="52" width="392" height="244" rx="4" fill="#FFFFFF" />

    <!-- ========================================== -->
    <!-- SCREEN HEADER BAR                          -->
    <!-- ========================================== -->
    <rect x="104" y="52" width="392" height="32" rx="4" fill="#F4F8FC" />
    <line x1="104" y1="84" x2="496" y2="84" stroke="#E2ECF5" stroke-width="1.5" />
    
    <!-- Top Left Address / Breadcrumb Bar -->
    <rect x="120" y="63" width="110" height="10" rx="3" fill="#FFFFFF" stroke="#D1E2F0" stroke-width="1" />

    <!-- Top Right 3 Window Action Dots -->
    <circle cx="456" cy="68" r="3.5" fill="#7FA8CB" />
    <circle cx="468" cy="68" r="3.5" fill="#7FA8CB" />
    <circle cx="480" cy="68" r="3.5" fill="#7FA8CB" />

    <!-- ========================================== -->
    <!-- SCREEN CONTENT: 3 COLUMNS WIREFRAME        -->
    <!-- ========================================== -->

    <!-- COLUMN 1 (LEFT): Main Hero Tile + 4 Line Items -->
    <g transform="translate(120, 98)">
      <!-- Large Solid Blue Feature Tile -->
      <rect x="0" y="0" width="90" height="52" rx="4" fill="#5B9BD5" />
      <line x1="10" y1="36" x2="48" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="10" y1="42" x2="34" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

      <!-- 4 Horizontal Card/Item Rows -->
      <rect x="0" y="62" width="90" height="12" rx="2.5" fill="#E8F1FA" stroke="#D2E4F3" stroke-width="1" />
      <line x1="8" y1="68" x2="45" y2="68" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" />

      <rect x="0" y="80" width="90" height="12" rx="2.5" fill="#E8F1FA" stroke="#D2E4F3" stroke-width="1" />
      <line x1="8" y1="86" x2="60" y2="86" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" />

      <rect x="0" y="98" width="90" height="12" rx="2.5" fill="#E8F1FA" stroke="#D2E4F3" stroke-width="1" />
      <line x1="8" y1="104" x2="52" y2="104" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" />

      <rect x="0" y="116" width="90" height="12" rx="2.5" fill="#E8F1FA" stroke="#D2E4F3" stroke-width="1" />
      <line x1="8" y1="122" x2="40" y2="122" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- COLUMN 2 (CENTER): Search Card + Map Pin Card -->
    <g transform="translate(226, 98)">
      <!-- Top Card: Magnifying Glass / Search Discovery Box -->
      <rect x="0" y="0" width="102" height="60" rx="4" fill="#F4F9FD" stroke="#D2E4F3" stroke-width="1" />
      <!-- Search Icon Graphic -->
      <circle cx="28" cy="22" r="9" stroke="#5B9BD5" stroke-width="2.5" fill="none" />
      <line x1="34" y1="28" x2="42" y2="36" stroke="#5B9BD5" stroke-width="2.8" stroke-linecap="round" />
      <!-- Text Lines -->
      <line x1="52" y1="18" x2="88" y2="18" stroke="#8CB9E0" stroke-width="2" stroke-linecap="round" />
      <line x1="52" y1="26" x2="80" y2="26" stroke="#B8D5ED" stroke-width="2" stroke-linecap="round" />
      <line x1="14" y1="46" x2="88" y2="46" stroke="#CBDFF2" stroke-width="2" stroke-linecap="round" />

      <!-- Bottom Card: Map Pin / Market Target Box -->
      <rect x="0" y="68" width="102" height="60" rx="4" fill="#F4F9FD" stroke="#D2E4F3" stroke-width="1" />
      <!-- Location Pin Icon Graphic -->
      <path d="M 28 80 C 23.5 80 20 83.5 20 88 C 20 94 28 102 28 102 C 28 102 36 94 36 88 C 36 83.5 32.5 80 28 80 Z" fill="#5B9BD5" />
      <circle cx="28" cy="87" r="3" fill="#FFFFFF" />
      <!-- Text Lines -->
      <line x1="48" y1="84" x2="88" y2="84" stroke="#8CB9E0" stroke-width="2" stroke-linecap="round" />
      <line x1="48" y1="92" x2="76" y2="92" stroke="#B8D5ED" stroke-width="2" stroke-linecap="round" />
      <line x1="14" y1="114" x2="88" y2="114" stroke="#CBDFF2" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- COLUMN 3 (RIGHT): Circular Pie Chart & Architecture Gear -->
    <g transform="translate(344, 98)">
      <!-- Chart Tile / Background -->
      <rect x="0" y="0" width="132" height="128" rx="4" fill="#F8FAFD" stroke="#DCE8F3" stroke-width="1" />
      
      <!-- Big Pie Chart Circle -->
      <circle cx="58" cy="44" r="28" fill="#5B9BD5" />
      <!-- Sector Wedge (Light Blue) -->
      <path d="M 58 44 L 58 16 A 28 28 0 0 1 86 44 Z" fill="#93C5FD" />
      <!-- Cutout Inner Center for Donut Feel -->
      <circle cx="58" cy="44" r="14" fill="#F8FAFD" />

      <!-- Overlapping Cogwheel / Gear Icon -->
      <g transform="translate(36, 22)">
        <circle cx="22" cy="22" r="16" fill="#2B5B84" />
        <circle cx="22" cy="22" r="7" fill="#F8FAFD" />
        <!-- Cog Teeth -->
        <rect x="19.5" y="2" width="5" height="6" rx="1.5" fill="#2B5B84" />
        <rect x="19.5" y="36" width="5" height="6" rx="1.5" fill="#2B5B84" />
        <rect x="2" y="19.5" width="6" height="5" rx="1.5" fill="#2B5B84" />
        <rect x="36" y="19.5" width="6" height="5" rx="1.5" fill="#2B5B84" />
        <rect x="8" y="8" width="5.5" height="5.5" rx="1.5" fill="#2B5B84" transform="rotate(45 10.75 10.75)" />
        <rect x="32" y="8" width="5.5" height="5.5" rx="1.5" fill="#2B5B84" transform="rotate(45 34.75 10.75)" />
        <rect x="8" y="32" width="5.5" height="5.5" rx="1.5" fill="#2B5B84" transform="rotate(45 10.75 34.75)" />
        <rect x="32" y="32" width="5.5" height="5.5" rx="1.5" fill="#2B5B84" transform="rotate(45 34.75 34.75)" />
      </g>

      <!-- Bottom Bar Graph Metrics -->
      <g transform="translate(16, 86)">
        <!-- 3 Vertical Bar Columns -->
        <rect x="0" y="18" width="10" height="16" rx="2" fill="#93C5FD" />
        <rect x="15" y="10" width="10" height="24" rx="2" fill="#5B9BD5" />
        <rect x="30" y="2" width="10" height="32" rx="2" fill="#2563EB" />
        
        <!-- Legend / Metric Lines beside bars -->
        <line x1="50" y1="12" x2="102" y2="12" stroke="#8CB9E0" stroke-width="2" stroke-linecap="round" />
        <line x1="50" y1="20" x2="90" y2="20" stroke="#B8D5ED" stroke-width="2" stroke-linecap="round" />
        <line x1="50" y1="28" x2="96" y2="28" stroke="#D1E2F0" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Bottom Wide Status Strip across screen -->
    <rect x="120" y="240" width="356" height="12" rx="3" fill="#5B9BD5" opacity="0.85" />

    <!-- ========================================== -->
    <!-- LAPTOP HINGE & BOTTOM CHASSIS BASE         -->
    <!-- ========================================== -->
    <!-- Hinge -->
    <path d="M 260 310 L 340 310 L 334 322 L 266 322 Z" fill="#132A40" />

    <!-- Bottom Open Laptop Base Desk Stand -->
    <path d="M 60 322 L 540 322 C 546 322 550 326 548 331 L 536 338 C 533 340 528 341 524 341 L 76 341 C 72 341 67 340 64 338 L 52 331 C 50 326 54 322 60 322 Z" fill="url(#laptopBaseGrad)" />

    <!-- Front Bevel Notch / Trackpad opener indentation -->
    <rect x="272" y="322" width="56" height="4" rx="2" fill="#2E5A82" />
  </g>
</svg>
