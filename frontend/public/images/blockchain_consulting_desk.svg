<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" fill="none" class="w-full h-auto">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Line -->
  <line x1="80" y1="360" x2="480" y2="360" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Bitcoin Token -->
  <g transform="translate(195, 75)" filter="url(#softGlow)">
    <circle cx="28" cy="28" r="28" fill="#93C5FD"/>
    <circle cx="28" cy="28" r="24" fill="#BFDBFE"/>
    <text x="28" y="37" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">₿</text>
  </g>

  <!-- Floating Analytics Card 1 (Left) -->
  <g transform="translate(95, 150)" filter="url(#softGlow)">
    <rect width="52" height="38" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="6" y="24" width="6" height="8" rx="1" fill="#93C5FD"/>
    <rect x="15" y="16" width="6" height="16" rx="1" fill="#60A5FA"/>
    <rect x="24" y="20" width="6" height="12" rx="1" fill="#93C5FD"/>
    <rect x="33" y="12" width="6" height="20" rx="1" fill="#3B82F6"/>
    <rect x="42" y="18" width="6" height="14" rx="1" fill="#93C5FD"/>
  </g>

  <!-- Floating Analytics Card 2 (Right Top) -->
  <g transform="translate(390, 85)" filter="url(#softGlow)">
    <rect width="54" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="6" y="26" width="6" height="8" rx="1" fill="#93C5FD"/>
    <rect x="15" y="18" width="6" height="16" rx="1" fill="#60A5FA"/>
    <rect x="24" y="14" width="6" height="20" rx="1" fill="#3B82F6"/>
    <rect x="33" y="22" width="6" height="12" rx="1" fill="#93C5FD"/>
    <rect x="42" y="10" width="6" height="24" rx="1" fill="#2563EB"/>
  </g>

  <!-- Floating Browser Window with Globe -->
  <g transform="translate(320, 145)" filter="url(#softGlow)">
    <rect width="70" height="52" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M 0 5 C 0 2.2 2.2 0 5 0 L 65 0 C 67.8 0 70 2.2 70 5 L 70 12 L 0 12 Z" fill="#F1F5F9"/>
    <circle cx="6" cy="6" r="2" fill="#CBD5E1"/>
    <circle cx="12" cy="6" r="2" fill="#CBD5E1"/>
    <circle cx="18" cy="6" r="2" fill="#CBD5E1"/>
    <!-- Wireframe Globe -->
    <circle cx="50" cy="32" r="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <ellipse cx="50" cy="32" rx="7" ry="14" fill="none" stroke="#60A5FA" stroke-width="1.2"/>
    <line x1="36" y1="32" x2="64" y2="32" stroke="#60A5FA" stroke-width="1.2"/>
    <line x1="39" y1="25" x2="61" y2="25" stroke="#93C5FD" stroke-width="1"/>
    <line x1="39" y1="39" x2="61" y2="39" stroke="#93C5FD" stroke-width="1"/>
    <!-- Content Lines -->
    <rect x="10" y="20" width="22" height="3" rx="1" fill="#94A3B8"/>
    <rect x="10" y="27" width="16" height="3" rx="1" fill="#CBD5E1"/>
    <rect x="10" y="34" width="20" height="3" rx="1" fill="#E2E8F0"/>
  </g>

  <!-- Floating Arrows & Gear -->
  <!-- Gear -->
  <g transform="translate(125, 85)" fill="#BFDBFE">
    <path d="M 12 0 L 15 0 L 16 3 C 17.5 3.5 19 4.3 20.2 5.3 L 23 4 L 25 6.5 L 23.5 9.2 C 24.3 10.5 24.8 11.9 25 13.5 L 28 14.5 L 28 17.5 L 25 18.5 C 24.8 20.1 24.3 21.5 23.5 22.8 L 25 25.5 L 23 28 L 20.2 26.7 C 19 27.7 17.5 28.5 16 29 L 15 32 L 12 32 L 11 29 C 9.5 28.5 8 27.7 6.8 26.7 L 4 28 L 2 25.5 L 3.5 22.8 C 2.7 21.5 2.2 20.1 2 18.5 L -1 17.5 L -1 14.5 L 2 13.5 C 2.2 11.9 2.7 10.5 3.5 9.2 L 2 6.5 L 4 4 L 6.8 5.3 C 8 4.3 9.5 3.5 11 3 Z" fill="#BFDBFE"/>
    <circle cx="13.5" cy="16" r="5" fill="#FFFFFF"/>
  </g>
  <!-- Transfer Arrows -->
  <g transform="translate(180, 60)" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="2" x2="8" y2="18"/>
    <polyline points="4 6 8 2 12 6"/>
  </g>
  <g transform="translate(165, 110)" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="18" x2="8" y2="2"/>
    <polyline points="4 14 8 18 12 14"/>
  </g>
  <g transform="translate(355, 60)" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="2" x2="8" y2="18"/>
    <polyline points="4 6 8 2 12 6"/>
  </g>
  <g transform="translate(415, 180)" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="18" x2="8" y2="2"/>
    <polyline points="4 14 8 18 12 14"/>
  </g>

  <!-- Network Connectors -->
  <path d="M 251 103 L 350 145" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="350" cy="145" r="3" fill="#3B82F6"/>

  <!-- Minimalist Modern Desk -->
  <rect x="235" y="228" width="195" height="10" rx="3" fill="#005F96"/>
  <!-- Desk Legs -->
  <line x1="245" y1="238" x2="245" y2="360" stroke="#005F96" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="415" y1="238" x2="415" y2="360" stroke="#005F96" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Chair -->
  <path d="M 245 200 L 260 270 L 285 270 L 280 360" stroke="#1E293B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="270" x2="240" y2="360" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <!-- Chair Back Cushion -->
  <rect x="242" y="175" width="14" height="42" rx="4" fill="#0284C7"/>

  <!-- Person / Developer -->
  <!-- Legs -->
  <path d="M 270 260 L 310 265 L 325 350 L 340 355" stroke="#0F172A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Shoes -->
  <ellipse cx="344" cy="358" rx="14" ry="5" fill="#0F172A"/>

  <!-- Torso & Shirt -->
  <path d="M 260 170 C 260 155 285 155 295 170 L 295 245 C 295 258 265 258 260 245 Z" fill="#38BDF8"/>
  
  <!-- Arms & Hands typing -->
  <path d="M 285 180 L 305 210 L 330 215" stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="334" cy="216" r="5" fill="#FDBA74"/>

  <!-- Head & Hair -->
  <circle cx="282" cy="148" r="11" fill="#FDBA74"/>
  <!-- Dark Hair -->
  <path d="M 273 146 C 273 136 292 136 292 144 C 286 142 278 144 274 150 Z" fill="#0F172A"/>

  <!-- Laptop on Desk -->
  <polygon points="310,228 340,228 335,210 315,210" fill="#38BDF8"/>
  <polygon points="305,228 348,228 346,225 308,225" fill="#0F172A"/>
</svg>
