<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Laptop Stand Base -->
  <path d="M 230 335 L 370 335 L 360 320 L 240 320 Z" fill="#1C2541" />
  <rect x="250" y="333" width="100" height="4" rx="2" fill="#0B132B" />

  <!-- Laptop Outer Body / Bezel -->
  <g filter="url(#softShadow)">
    <rect x="110" y="70" width="380" height="250" rx="18" fill="#0B132B" stroke="#1C2541" stroke-width="4" />
    <!-- Screen Glass -->
    <rect x="118" y="78" width="364" height="234" rx="12" fill="#EBF4FA" />

    <!-- Code Line Wireframes on Screen -->
    <g fill="#D2E3F0">
      <rect x="135" y="98" width="170" height="8" rx="4" />
      <rect x="135" y="114" width="140" height="6" rx="3" fill="#DCEBF5" />
      <rect x="135" y="128" width="180" height="6" rx="3" fill="#DCEBF5" />

      <rect x="135" y="148" width="150" height="6" rx="3" />
      <rect x="135" y="162" width="110" height="6" rx="3" />
      <rect x="135" y="176" width="160" height="6" rx="3" fill="#DCEBF5" />

      <rect x="135" y="198" width="130" height="6" rx="3" fill="#DCEBF5" />
      <rect x="135" y="212" width="90" height="6" rx="3" fill="#DCEBF5" />
    </g>

    <!-- Top Badge: Django REST -->
    <g transform="translate(200, 90)">
      <rect x="0" y="0" width="90" height="22" rx="11" fill="#092E20" />
      <text x="45" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">Django REST</text>
    </g>

    <!-- Bottom Badge: PostgreSQL -->
    <g transform="translate(205, 260)">
      <rect x="0" y="0" width="85" height="22" rx="11" fill="#205493" />
      <text x="42.5" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Top-Right Small Tag "3" -->
    <g transform="translate(425, 125)">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#1D70B8" />
      <text x="12" y="14" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>

    <!-- Overlapping Green Smartphone (Matching Image 2 Exactly) -->
    <g transform="translate(325, 120)" filter="url(#phoneShadow)">
      <!-- Outer Phone Bezel -->
      <rect x="0" y="0" width="110" height="180" rx="16" fill="#031F16" stroke="#073325" stroke-width="3" />
      <!-- Phone Display Screen -->
      <rect x="4" y="4" width="102" height="172" rx="13" fill="#007E52" />

      <!-- Speaker Notch -->
      <rect x="40" y="9" width="30" height="3" rx="1.5" fill="#031F16" />

      <!-- Center Red Circle with Guitar Logo -->
      <circle cx="55" cy="85" r="15" fill="#DC2626" />
      <!-- White Guitar Icon -->
      <path d="M 52 92 L 54 85 L 59 78 C 60 77 61 77 61 78 C 61 79 60 80 59 81 L 54 87 L 52 92 Z" fill="#FFFFFF" />
      <circle cx="53" cy="90" r="3" fill="#FFFFFF" />

      <!-- DJANGO READY Text -->
      <text x="55" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DJANGO READY</text>
    </g>
  </g>
</svg>
