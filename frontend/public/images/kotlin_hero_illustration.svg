<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="kotlinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7F52FF" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Official Kotlin Gradient -->
    <linearGradient id="kotlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E44857"/>
      <stop offset="40%" stop-color="#C711E1"/>
      <stop offset="100%" stop-color="#7F52FF"/>
    </linearGradient>

    <!-- Phone Body Gradient -->
    <linearGradient id="androidDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="jetpackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#07C160"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005F96"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- NO CONTAINER BOX - 100% TRANSPARENT CANVAS -->

  <!-- Floating Badge 1: Top Left - Kotlin 2.0 Badge -->
  <g transform="translate(40, 45)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="125" height="44" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Official Kotlin K Logo -->
    <rect x="8" y="8" width="28" height="28" rx="8" fill="url(#kotlinGrad)"/>
    <path d="M14 14 L28 14 L21 22 L28 30 L14 30 Z" fill="#ffffff"/>
    <text x="78" y="27" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a" text-anchor="middle">Kotlin 2.0</text>
  </g>

  <!-- Floating Badge 2: Top Right - Jetpack Compose -->
  <g transform="translate(430, 40)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="135" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="28" height="28" rx="8" fill="url(#jetpackGrad)"/>
    <path d="M17 23 L22 28 L31 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Jetpack UI</text>
    <text x="82" y="36" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Declarative</text>
  </g>

  <!-- Floating Badge 3: Middle Right - KMM (Multiplatform) -->
  <g transform="translate(445, 235)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="125" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="30" height="30" rx="8" fill="#005F96"/>
    <text x="25" y="29" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">KMM</text>
    <text x="82" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Multiplatform</text>
    <text x="82" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">iOS &amp; Android</text>
  </g>

  <!-- Floating Badge 4: Bottom Left - Google Official -->
  <g transform="translate(30, 320)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="140" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="14" fill="#3DDC84"/>
    <!-- Android Robot Head outline -->
    <path d="M17 26 C17 19, 33 19, 33 26 Z" fill="#ffffff"/>
    <circle cx="21" cy="22" r="1.5" fill="#0f172a"/>
    <circle cx="29" cy="22" r="1.5" fill="#0f172a"/>
    <text x="88" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Google First</text>
    <text x="88" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Official Language</text>
  </g>

  <!-- CENTER SMARTPHONE MOCKUP -->
  <g transform="translate(190, 20)" filter="url(#kotlinShadow)">
    <!-- Outer Phone Frame -->
    <rect x="0" y="0" width="220" height="410" rx="36" fill="url(#androidDark)" stroke="#334155" stroke-width="4"/>

    <!-- Inner Screen Area -->
    <rect x="8" y="8" width="204" height="394" rx="28" fill="#f8fafc"/>

    <!-- Camera Punch Hole -->
    <circle cx="110" cy="22" r="5" fill="#0f172a"/>

    <!-- Screen Header (Kotlin Gradient) -->
    <rect x="8" y="8" width="204" height="95" rx="28" fill="url(#kotlinGrad)"/>
    <text x="24" y="52" font-family="sans-serif" font-weight="900" font-size="15" fill="#ffffff">Kotlin Native App</text>
    <text x="24" y="68" font-family="sans-serif" font-weight="500" font-size="10" fill="#fbcfe8">Jetpack Compose UI</text>

    <!-- App Content Cards -->
    <!-- Code Editor Card Widget -->
    <rect x="20" y="86" width="180" height="80" rx="12" fill="#1e293b" filter="url(#badgeShadow)"/>
    <text x="32" y="104" font-family="monospace" font-weight="700" font-size="11" fill="#3DDC84">@Composable</text>
    <text x="32" y="120" font-family="monospace" font-size="10" fill="#a855f7">fun <tspan fill="#38bdf8">KotlinApp</tspan>() {</text>
    <text x="44" y="136" font-family="monospace" font-size="10" fill="#cbd5e1">Text(<tspan fill="#f59e0b">"High Speed 60FPS"</tspan>)</text>
    <text x="32" y="152" font-family="monospace" font-size="10" fill="#a855f7">}</text>

    <!-- UI Widget 1: Analytics Bar -->
    <rect x="20" y="176" width="180" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="195" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b">Memory Efficiency</text>
    <text x="32" y="214" font-family="sans-serif" font-weight="900" font-size="16" fill="#7F52FF">99.8% Smooth</text>
    <!-- Mini Progress Bar -->
    <rect x="32" y="224" width="156" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="32" y="224" width="135" height="8" rx="4" fill="url(#kotlinGrad)"/>

    <!-- UI Widget 2: Coroutines Async Status -->
    <rect x="20" y="256" width="180" height="55" rx="12" fill="url(#blueGrad)"/>
    <text x="34" y="280" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">Coroutines Async</text>
    <text x="34" y="294" font-family="sans-serif" font-weight="500" font-size="9" fill="#e0f2fe">Zero-Lag Non-Blocking I/O</text>

    <!-- Bottom Action Button in Phone -->
    <rect x="20" y="325" width="180" height="38" rx="10" fill="url(#jetpackGrad)"/>
    <text x="110" y="349" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">Build Kotlin App →</text>
  </g>
</svg>
