<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Potted Plant -->
  <g transform="translate(30, 240)">
    <polygon points="10,50 30,50 35,90 5,90" fill="#0284c7"/>
    <path d="M20 50 Q-10 10 0 -20 Q20 10 20 50 Z" fill="#38bdf8"/>
    <path d="M20 50 Q40 10 30 -10 Q10 20 20 50 Z" fill="#0284c7"/>
  </g>

  <!-- Floating Checkmark Circle Top Left -->
  <g transform="translate(90, 80)" filter="url(#shadow2)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <path d="M12 20 L18 26 L28 14" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating HTML Code Banner Top Left-Center -->
  <g transform="translate(160, 60)" filter="url(#shadow2)">
    <rect x="0" y="0" width="110" height="36" fill="#0284c7" rx="6"/>
    <text x="55" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">HTML</text>
  </g>

  <!-- Floating CSS Code Banner Top Right-Center -->
  <g transform="translate(360, 80)" filter="url(#shadow2)">
    <rect x="0" y="0" width="100" height="36" fill="#fef08a" stroke="#eab308" stroke-width="2" rx="6"/>
    <text x="50" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ca8a04" text-anchor="middle">CSS</text>
  </g>

  <!-- Main Central Code Board / Monitor -->
  <g transform="translate(180, 110)" filter="url(#shadow2)">
    <rect x="0" y="0" width="220" height="150" fill="#ffffff" rx="10" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Wireframe Lines -->
    <line x1="20" y1="30" x2="100" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="45" x2="70" y2="45" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="130" y2="60" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="75" x2="90" y2="75" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Code Bracket Icon -->
    <text x="175" y="45" font-family="monospace" font-weight="bold" font-size="20" fill="#94a3b8">&lt;/&gt;</text>
  </g>

  <!-- Left Developer Character (Man in Blue Shirt) -->
  <g transform="translate(100, 140)">
    <!-- Legs -->
    <rect x="25" y="90" width="14" height="85" fill="#1e293b" rx="4"/>
    <rect x="45" y="90" width="14" height="85" fill="#1e293b" rx="4"/>
    <!-- Shirt -->
    <path d="M15 25 C15 10, 70 10, 70 25 L65 95 H20 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="42" cy="-5" r="16" fill="#fca5a5"/>
    <path d="M28 -10 C28 -22, 56 -22, 56 -10" fill="#334155"/>
    <!-- Arm holding HTML card -->
    <path d="M60 30 L95 -10 L105 -2 L70 38 Z" fill="#0284c7"/>
  </g>

  <!-- Center Developer Woman (Sitting in Front of Symfony Screen) -->
  <g transform="translate(230, 180)">
    <!-- Symfony Laptop Display -->
    <rect x="15" y="20" width="70" height="50" fill="#0f172a" rx="6" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="45" r="16" fill="#0284c7"/>
    <text x="50" y="51" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="14" fill="#ffffff" text-anchor="middle">sf</text>

    <!-- Woman sitting -->
    <!-- Legs crossed -->
    <path d="M10 80 Q50 110 90 80 Q50 90 10 80 Z" fill="#1e293b"/>
    <!-- Pink Top -->
    <path d="M30 50 Q50 45 70 50 L65 85 H35 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="50" cy="30" r="13" fill="#fca5a5"/>
    <path d="M36 25 C36 12, 64 12, 64 25 L65 45 C55 45, 55 30, 50 30 C45 30, 45 45, 35 45 Z" fill="#475569"/>
  </g>

  <!-- Right Developer Character (Man carrying CSS box) -->
  <g transform="translate(390, 150)">
    <!-- Legs -->
    <rect x="25" y="80" width="14" height="85" fill="#1e293b" rx="4"/>
    <rect x="45" y="80" width="14" height="85" fill="#1e293b" rx="4"/>
    <!-- Shirt -->
    <path d="M15 20 C15 5, 70 5, 70 20 L65 85 H20 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="42" cy="-10" r="16" fill="#fca5a5"/>
    <path d="M28 -15 C28 -27, 56 -27, 56 -15" fill="#b45309"/>
    <!-- Arms extending left carrying panel -->
    <path d="M20 30 L-20 20 L-15 10 L25 20 Z" fill="#0284c7"/>
  </g>

  <!-- Right Blue Plant -->
  <g transform="translate(520, 240)">
    <polygon points="10,50 30,50 35,90 5,90" fill="#0284c7"/>
    <path d="M20 50 Q-10 10 0 -20 Q20 10 20 50 Z" fill="#0284c7"/>
    <path d="M20 50 Q40 10 30 -10 Q10 20 20 50 Z" fill="#38bdf8"/>
  </g>
</svg>
