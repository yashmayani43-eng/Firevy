<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Floating Badges & Monitor -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2B48" flood-opacity="0.12" />
    </filter>
    <filter id="monitorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Metallic Gradient for Stand -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- .NET Wave Logo Gradient -->
    <linearGradient id="netWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4EF" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#50E6FF" />
    </linearGradient>
  </defs>

  <!-- TRANSPARENT BACKGROUND (No solid bg rectangle!) -->

  <!-- ==================== BACKGROUND OUTLINE GEARS ==================== -->
  <g stroke="#C2DCF0" stroke-width="2" fill="none" opacity="0.85">
    <!-- Top-Left Background Gear -->
    <g transform="translate(190, 140)">
      <circle cx="0" cy="0" r="42" stroke-dasharray="8,5" />
      <circle cx="0" cy="0" r="26" />
      <!-- Teeth -->
      <path d="M 0 -48 L 0 -42 M 0 42 L 0 48 M -48 0 L -42 0 M 42 0 L 48 0 M -34 -34 L -30 -30 M 30 30 L 34 34 M -34 34 L -30 30 M 30 -30 L 34 -34" stroke-width="2.5" />
    </g>

    <!-- Right Background Gear -->
    <g transform="translate(470, 230)">
      <circle cx="0" cy="0" r="48" stroke-dasharray="9,6" />
      <circle cx="0" cy="0" r="30" />
      <!-- Teeth -->
      <path d="M 0 -54 L 0 -48 M 0 48 L 0 54 M -54 0 L -48 0 M 48 0 L 54 0 M -38 -38 L -34 -34 M 34 34 L 38 38 M -38 38 L -34 34 M 34 -34 L 38 -38" stroke-width="2.5" />
    </g>

    <!-- Bottom-Left Background Gear -->
    <g transform="translate(100, 340)">
      <circle cx="0" cy="0" r="40" stroke-dasharray="7,5" />
      <circle cx="0" cy="0" r="24" />
      <!-- Teeth -->
      <path d="M 0 -46 L 0 -40 M 0 40 L 0 46 M -46 0 L -40 0 M 40 0 L 46 0 M -32 -32 L -28 -28 M 28 28 L 32 32 M -32 32 L -28 28 M 28 -28 L 32 -32" stroke-width="2.5" />
    </g>
  </g>

  <!-- ==================== MONITOR STAND ==================== -->
  <g>
    <!-- Base Ellipse Foot -->
    <ellipse cx="270" cy="388" rx="42" ry="7" fill="#64748B" />
    <path d="M 230 388 Q 270 382 310 388 L 305 380 Q 270 376 235 380 Z" fill="#94A3B8" />
    <!-- Metallic Stand Neck -->
    <path d="M 252 325 L 288 325 L 295 384 L 245 384 Z" fill="url(#standGrad)" />
  </g>

  <!-- ==================== MAIN DESKTOP MONITOR FRAME ==================== -->
  <g filter="url(#monitorShadow)">
    <!-- Black Outer Frame -->
    <rect x="100" y="130" width="340" height="225" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="6" />
    <!-- White Inner Screen Area -->
    <rect x="106" y="136" width="328" height="213" rx="10" fill="#FFFFFF" />

    <!-- Sky Blue Browser Header Bar -->
    <path d="M 106 146 C 106 140, 110 136, 116 136 L 424 136 C 430 136, 434 140, 434 146 L 434 160 L 106 160 Z" fill="#48A9E6" />
    <!-- Window Control Dots -->
    <circle cx="120" cy="148" r="4" fill="#FF5F56" />
    <circle cx="132" cy="148" r="4" fill="#FFBD2E" />
    <circle cx="144" cy="148" r="4" fill="#27C93F" />

    <!-- Code Lines inside Browser Screen (Left Side) -->
    <g fill="#A0CBE8">
      <rect x="124" y="176" width="65" height="6" rx="3" fill="#64B5F6" />
      <rect x="124" y="190" width="145" height="6" rx="3" />
      <rect x="124" y="204" width="110" height="6" rx="3" />

      <rect x="124" y="222" width="130" height="5" rx="2.5" fill="#90CAF9" />
      <rect x="136" y="234" width="105" height="5" rx="2.5" fill="#BBDEFB" />
      <rect x="136" y="246" width="90" height="5" rx="2.5" fill="#BBDEFB" />
      <rect x="124" y="258" width="115" height="5" rx="2.5" fill="#90CAF9" />

      <rect x="124" y="274" width="70" height="5" rx="2.5" fill="#BBDEFB" />
      <rect x="124" y="286" width="150" height="5" rx="2.5" fill="#90CAF9" />
      <rect x="124" y="298" width="95" height="5" rx="2.5" fill="#BBDEFB" />
      <rect x="124" y="310" width="135" height="5" rx="2.5" fill="#90CAF9" />
      <rect x="124" y="322" width="80" height="5" rx="2.5" fill="#BBDEFB" />
    </g>

    <!-- Prominent Microsoft .NET Wave Logo (Right Side of Screen) -->
    <g transform="translate(315, 240)">
      <!-- Blue Ribbon/Wave Logo Icon -->
      <path d="M -30 -35 C -15 -55, 10 -15, 25 -38 C 30 -45, 36 -32, 28 -20 C 12 5, -15 -35, -25 -10 C -28 -3, -34 -25, -30 -35 Z" fill="url(#netWave)" />
      <!-- Text "Microsoft" -->
      <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#262626" text-anchor="middle" letter-spacing="-0.2">Microsoft®</text>
      <!-- Text ".NET" -->
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#000000" text-anchor="middle" letter-spacing="-1">.NET</text>
    </g>
  </g>

  <!-- ==================== 5 FLOATING BADGES ==================== -->

  <!-- BADGE 1: Top-Center (Microsoft SQL Server - Pink) -->
  <g transform="translate(275, 80)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#FF4B82" />
    <!-- SQL Server Ribbon/Flame Logo Icon -->
    <g transform="translate(36, 26)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <path d="M -14 6 C -14 -6, 0 -12, 14 -6 C 14 6, 0 12, -14 6 Z" />
      <path d="M -14 6 C -14 14, 0 20, 14 14" />
      <path d="M -14 -6 L -14 14" />
      <path d="M 14 -6 L 14 14" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <text x="36" y="54" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft</text>
    <text x="36" y="63" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">SQL Server</text>
  </g>

  <!-- BADGE 2: Top-Right (C# - Teal/Emerald) -->
  <g transform="translate(410, 105)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#00C49F" />
    <!-- C# Hexagon/Circle Badge -->
    <circle cx="32" cy="32" r="19" fill="#00A887" />
    <path d="M 32 17 L 44 24 L 44 40 L 32 47 L 20 40 L 20 24 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <text x="32" y="37" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">C#</text>
  </g>

  <!-- BADGE 3: Middle-Right (Visual Studio - Blue) -->
  <g transform="translate(395, 275)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#007ACC" />
    <!-- Visual Studio Ribbon Icon (Infinity Shape Loop) -->
    <path d="M 18 36 L 27 45 L 46 22 L 46 42 L 34 30 L 25 39 Z M 18 28 L 27 19 L 46 42 L 46 22 L 34 34 L 25 25 Z" fill="#FFFFFF" />
  </g>

  <!-- BADGE 4: Bottom-Left (MySQL - Gold/Orange) -->
  <g transform="translate(135, 320)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="#F5A623" />
    <!-- Dolphin Silhouette -->
    <path d="M 22 28 C 25 20 38 18 44 24 C 40 26 36 25 32 28 C 36 30 40 32 44 32 C 38 38 25 38 22 28 Z" fill="#FFFFFF" />
    <text x="30" y="48" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">MySQL</text>
  </g>

  <!-- BADGE 5: Middle-Left (Azure - Purple) -->
  <g transform="translate(55, 185)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="#702A8C" />
    <!-- Azure Polygon Triangle Logo -->
    <path d="M 30 18 L 46 42 L 34 42 Z" fill="#FFFFFF" />
    <path d="M 20 38 L 32 18 L 36 25 L 26 42 Z" fill="#E2B3F7" />
    <text x="33" y="54" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure</text>
  </g>
</svg>
