<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2B48" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Gear Outlines -->
  <g stroke="#D5E6F5" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top Center-Right Gear -->
    <g transform="translate(420, 90)">
      <circle cx="0" cy="0" r="32" stroke-dasharray="6,4" />
      <circle cx="0" cy="0" r="18" />
    </g>
    <!-- Right Background Gear -->
    <g transform="translate(560, 220)">
      <circle cx="0" cy="0" r="45" stroke-dasharray="8,5" />
      <circle cx="0" cy="0" r="26" />
    </g>
    <!-- Bottom Left Background Gear -->
    <g transform="translate(380, 360)">
      <circle cx="0" cy="0" r="38" stroke-dasharray="7,4" />
      <circle cx="0" cy="0" r="20" />
    </g>
  </g>

  <!-- Monitor Stand Base -->
  <g>
    <!-- Base Plate -->
    <path d="M 310 395 L 390 395 L 380 380 L 320 380 Z" fill="#94A3B8" />
    <ellipse cx="350" cy="393" rx="45" ry="6" fill="#64748B" />
    <!-- Stand Neck -->
    <path d="M 340 330 L 360 330 L 365 385 L 335 385 Z" fill="url(#neckGrad)" />
    <defs>
      <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#CBD5E1" />
        <stop offset="50%" stop-color="#94A3B8" />
        <stop offset="100%" stop-color="#64748B" />
      </linearGradient>
    </defs>
  </g>

  <!-- Main Desktop Monitor Frame -->
  <g filter="url(#cardShadow)">
    <!-- Outer Monitor Frame (Black) -->
    <rect x="240" y="110" width="220" height="230" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="6" />
    <!-- Inner Screen Area -->
    <rect x="244" y="114" width="212" height="222" rx="10" fill="#FFFFFF" />

    <!-- Browser Header Bar (Blue) -->
    <path d="M 244 124 C 244 118, 248 114, 254 114 L 446 114 C 452 114, 456 118, 456 124 L 456 136 L 244 136 Z" fill="#4B9CD3" />
    <!-- Browser Window Control Dots -->
    <circle cx="256" cy="125" r="3.5" fill="#FFFFFF" />
    <circle cx="266" cy="125" r="3.5" fill="#F8FAFC" opacity="0.9" />
    <circle cx="276" cy="125" r="3.5" fill="#F8FAFC" opacity="0.9" />

    <!-- Code Lines inside Browser Screen -->
    <g fill="#5B9FD5" opacity="0.85">
      <rect x="256" y="152" width="130" height="6" rx="3" />
      <rect x="256" y="168" width="90" height="6" rx="3" />

      <rect x="256" y="190" width="80" height="5" rx="2.5" fill="#8BBEE8" />
      <rect x="256" y="202" width="115" height="5" rx="2.5" fill="#8BBEE8" />
      <rect x="256" y="214" width="70" height="5" rx="2.5" fill="#8BBEE8" />
      <rect x="256" y="226" width="105" height="5" rx="2.5" fill="#8BBEE8" />

      <rect x="256" y="244" width="75" height="5" rx="2.5" fill="#A2D2F8" />
      <rect x="256" y="256" width="120" height="5" rx="2.5" fill="#A2D2F8" />
      <rect x="256" y="268" width="60" height="5" rx="2.5" fill="#A2D2F8" />
      <rect x="256" y="280" width="110" height="5" rx="2.5" fill="#A2D2F8" />
    </g>

    <!-- Prominent Green Django Logo Text on Screen -->
    <g transform="translate(370, 205)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" fill="#44B78B" letter-spacing="-1">django</text>
    </g>
  </g>

  <!-- Floating Badge 1: Top-Left (Python) -->
  <g transform="translate(225, 185)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#BCE0F7" />
    <!-- Python Icon -->
    <path d="M 22 13 C 17 13 17 15 17 15 L 17 19 L 22 19 L 22 20 L 15 20 C 15 20 13 20 13 25 C 13 30 15 30 15 30 L 17 30 L 17 28 C 17 26 19 24 21 24 L 27 24 C 28 24 29 23 29 22 L 29 17 C 29 17 29 13 22 13 Z" fill="#387BB2" />
    <path d="M 26 35 C 31 35 31 33 31 33 L 31 29 L 26 29 L 26 28 L 33 28 C 33 28 35 28 35 23 C 35 18 33 18 33 18 L 31 18 L 31 20 C 31 22 29 24 27 24 L 21 24 C 20 24 19 25 19 26 L 19 31 C 19 31 19 35 26 35 Z" fill="#4B9CD3" />
    <circle cx="19" cy="16" r="1" fill="#FFFFFF" />
    <circle cx="29" cy="32" r="1" fill="#FFFFFF" />
    <text x="24" y="44" font-family="sans-serif" font-size="6" font-weight="bold" fill="#2B6B9C" text-anchor="middle">Python</text>
  </g>

  <!-- Floating Badge 2: Top-Right (JS Javascript) -->
  <g transform="translate(445, 105)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#BCE0F7" />
    <!-- JS Icon -->
    <rect x="14" y="12" width="20" height="20" rx="3" fill="#387BB2" />
    <text x="24" y="27" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">JS</text>
    <text x="24" y="42" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#2B6B9C" text-anchor="middle">Javascript</text>
  </g>

  <!-- Floating Badge 3: Bottom-Left (Git) -->
  <g transform="translate(255, 315)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#BCE0F7" />
    <!-- Git Branch Icon -->
    <g transform="translate(16, 12)" fill="none" stroke="#2B6B9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 5 3 L 5 15" />
      <circle cx="5" cy="3" r="2" fill="#2B6B9C" />
      <circle cx="5" cy="15" r="2" fill="#2B6B9C" />
      <path d="M 5 9 Q 11 9 12 12" />
      <circle cx="12" cy="13" r="2" fill="#2B6B9C" />
    </g>
    <text x="24" y="42" font-family="sans-serif" font-size="6" font-weight="bold" fill="#2B6B9C" text-anchor="middle">Git</text>
  </g>

  <!-- Floating Badge 4: Bottom-Right (Angular) -->
  <g transform="translate(440, 270)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#BCE0F7" />
    <!-- Angular 'A' Shield Icon -->
    <path d="M 24 12 L 32 15 L 30 25 L 24 29 L 18 25 L 16 15 Z" fill="#387BB2" />
    <path d="M 24 15 L 28 24 L 26.5 24 L 25.5 22 L 22.5 22 L 21.5 24 L 20 24 Z M 24 18 L 23 20.5 L 25 20.5 Z" fill="#FFFFFF" />
    <text x="24" y="42" font-family="sans-serif" font-size="6" font-weight="bold" fill="#2B6B9C" text-anchor="middle">Angular</text>
  </g>
</svg>
