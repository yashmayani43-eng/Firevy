<svg width="630" height="430" viewBox="0 0 630 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="100" y1="50" x2="520" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blueBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cyanBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softShadow" x="-10" y="-10" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#005F96" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B0F19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Cloud Shapes -->
  <path d="M120 220 C80 220 50 180 60 140 C70 95 120 80 150 90 C180 40 260 30 310 70 C350 40 430 45 460 95 C510 100 540 145 530 190 C560 220 550 280 500 300 C470 330 380 340 330 320 C280 350 180 340 140 300 C90 300 80 250 120 220 Z" fill="url(#cloudGrad)" opacity="0.45"/>

  <!-- Ground Shadow / Base Ellipse -->
  <ellipse cx="315" cy="390" rx="260" ry="25" fill="#E2E8F0" opacity="0.6"/>

  <!-- Main Central Analytics Dashboard Tablet / Monitor -->
  <g filter="url(#softShadow)">
    <rect x="130" y="80" width="370" height="250" rx="16" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Dashboard Top Bar -->
    <rect x="130" y="80" width="370" height="38" rx="16" fill="#0F172A"/>
    <rect x="130" y="104" width="370" height="14" fill="#0F172A"/>
    <circle cx="152" cy="99" r="4.5" fill="#EF4444"/>
    <circle cx="168" cy="99" r="4.5" fill="#F59E0B"/>
    <circle cx="184" cy="99" r="4.5" fill="#10B981"/>
    <rect x="230" y="91" width="170" height="16" rx="8" fill="#1E293B"/>
    <text x="315" y="103" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="sans-serif" font-weight="600">cloud-analytics-telemetry.io</text>

    <!-- Inner Dashboard Elements -->
    <!-- Metric Box 1 -->
    <rect x="150" y="132" width="95" height="52" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
    <text x="160" y="148" font-size="8" fill="#0284C7" font-family="sans-serif" font-weight="700">DATA STREAM</text>
    <text x="160" y="168" font-size="14" fill="#0B0F19" font-family="sans-serif" font-weight="800">4.8 GB/s</text>
    <path d="M210 162 L225 152 L235 157" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Metric Box 2 -->
    <rect x="255" y="132" width="105" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="265" y="148" font-size="8" fill="#64748B" font-family="sans-serif" font-weight="700">QUERY LATENCY</text>
    <text x="265" y="168" font-size="14" fill="#0B0F19" font-family="sans-serif" font-weight="800">12.4 ms</text>
    <text x="328" y="167" font-size="9" fill="#10B981" font-family="sans-serif" font-weight="700">↓ 38%</text>

    <!-- Metric Box 3 -->
    <rect x="370" y="132" width="110" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="380" y="148" font-size="8" fill="#64748B" font-family="sans-serif" font-weight="700">AI ACCURACY</text>
    <text x="380" y="168" font-size="14" fill="#005F96" font-family="sans-serif" font-weight="800">99.82%</text>

    <!-- Main Chart Area: Line Chart with Gradient Fill -->
    <rect x="150" y="196" width="210" height="116" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="160" y1="290" x2="350" y2="290" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="160" y1="260" x2="350" y2="260" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="160" y1="230" x2="350" y2="230" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Area gradient under curve -->
    <path d="M165 280 Q200 240, 230 250 T280 215 T345 195 L345 295 L165 295 Z" fill="#E0F2FE" opacity="0.6"/>
    <!-- Line curve -->
    <path d="M165 280 Q200 240, 230 250 T280 215 T345 195" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Data points -->
    <circle cx="165" cy="280" r="3.5" fill="#0284C7"/>
    <circle cx="230" cy="250" r="3.5" fill="#0284C7"/>
    <circle cx="280" cy="215" r="4" fill="#005F96" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="345" cy="195" r="4.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Bar Chart Box -->
    <rect x="370" y="196" width="110" height="116" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="380" y="214" font-size="8" fill="#64748B" font-family="sans-serif" font-weight="700">NODE UTILIZATION</text>
    <!-- Bar 1 -->
    <rect x="382" y="255" width="10" height="42" rx="3" fill="#BAE6FD"/>
    <rect x="382" y="270" width="10" height="27" rx="3" fill="url(#cyanBarGrad)"/>
    <!-- Bar 2 -->
    <rect x="402" y="240" width="10" height="57" rx="3" fill="#BAE6FD"/>
    <rect x="402" y="250" width="10" height="47" rx="3" fill="url(#cyanBarGrad)"/>
    <!-- Bar 3 -->
    <rect x="422" y="228" width="10" height="69" rx="3" fill="#BAE6FD"/>
    <rect x="422" y="235" width="10" height="62" rx="3" fill="url(#blueBarGrad)"/>
    <!-- Bar 4 -->
    <rect x="442" y="248" width="10" height="49" rx="3" fill="#BAE6FD"/>
    <rect x="442" y="260" width="10" height="37" rx="3" fill="url(#cyanBarGrad)"/>
    <!-- Bar 5 -->
    <rect x="462" y="222" width="10" height="75" rx="3" fill="#BAE6FD"/>
    <rect x="462" y="225" width="10" height="72" rx="3" fill="url(#blueBarGrad)"/>
  </g>

  <!-- Monitor Stand -->
  <path d="M290 330 L300 365 L330 365 L340 330 Z" fill="#94A3B8"/>
  <rect x="270" y="365" width="90" height="8" rx="4" fill="#64748B"/>

  <!-- Left Floating Cloud Node Card -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="160" width="130" height="80" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="52" y="172" width="28" height="28" rx="6" fill="#E0F2FE"/>
    <path d="M60 188 C57 188 55 186 55 183 C55 180 57 178 60 178 C61 175 64 173 67 174 C69 171 74 172 75 175 C77 175 79 177 79 179 C80 181 79 184 77 185 C77 188 74 188 72 188 Z" fill="#0284C7"/>
    <text x="88" y="184" font-size="10" fill="#0F172A" font-family="sans-serif" font-weight="700">Multi-Cloud</text>
    <text x="88" y="196" font-size="8" fill="#10B981" font-family="sans-serif" font-weight="600">● Real-time sync</text>
    <rect x="52" y="212" width="106" height="4" rx="2" fill="#F1F5F9"/>
    <rect x="52" y="212" width="85" height="4" rx="2" fill="#0284C7"/>
  </g>

  <!-- Right Floating Predictive AI Card -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="220" width="140" height="85" rx="12" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="472" y="232" width="30" height="30" rx="6" fill="#F0FDF4"/>
    <!-- Target / AI icon -->
    <circle cx="487" cy="247" r="8" fill="none" stroke="#16A34A" stroke-width="2"/>
    <circle cx="487" cy="247" r="3" fill="#16A34A"/>
    <text x="510" y="244" font-size="10" fill="#0F172A" font-family="sans-serif" font-weight="700">Predictive BI</text>
    <text x="510" y="256" font-size="8" fill="#64748B" font-family="sans-serif">Automated Insights</text>
    <rect x="472" y="276" width="116" height="16" rx="4" fill="#F8FAFC"/>
    <text x="480" y="287" font-size="8" fill="#0284C7" font-family="sans-serif" font-weight="600">Forecast: +42% Growth</text>
  </g>

  <!-- Connected Dotted Data Stream Lines -->
  <path d="M170 200 C200 200 210 160 250 160" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="210" cy="180" r="3" fill="#0284C7"/>
  <path d="M460 260 C420 260 410 280 370 280" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="415" cy="270" r="3" fill="#38BDF8"/>
</svg>
