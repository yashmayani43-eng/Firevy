<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#005F96" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005F96"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="100%" stop-color="#01B5F6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="darkPhoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- 100% TRANSPARENT CANVAS -->

  <!-- Floating Badge 1: Top Left - Cross-Platform Tech -->
  <g transform="translate(30, 42)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="145" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="8" width="30" height="30" rx="9" fill="url(#flutterGrad)"/>
    <!-- Atom / Cross Icon -->
    <circle cx="25" cy="23" r="4" fill="#ffffff"/>
    <ellipse cx="25" cy="23" rx="10" ry="4" stroke="#ffffff" stroke-width="1.2" fill="none" transform="rotate(30 25 23)"/>
    <ellipse cx="25" cy="23" rx="10" ry="4" stroke="#ffffff" stroke-width="1.2" fill="none" transform="rotate(-30 25 23)"/>
    <text x="92" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">React &amp; Flutter</text>
    <text x="92" y="36" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Cross-Platform</text>
  </g>

  <!-- Floating Badge 2: Top Right - Dual Platform iOS & Android -->
  <g transform="translate(425, 38)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="140" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="8" width="30" height="30" rx="9" fill="url(#primaryGrad)"/>
    <!-- Phone / Tablet Dual Icon -->
    <rect x="17" y="14" width="8" height="14" rx="2" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <rect x="27" y="16" width="6" height="10" rx="1.5" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <text x="90" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">iOS &amp; Android</text>
    <text x="90" y="36" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Unified Code</text>
  </g>

  <!-- Floating Badge 3: Middle Right - Single Codebase -->
  <g transform="translate(440, 230)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="135" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="30" height="30" rx="9" fill="url(#emeraldGrad)"/>
    <!-- Code Brackets Icon -->
    <path d="M18 20 L14 24 L18 28 M28 20 L32 24 L28 28 M25 18 L21 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">99% Code Reuse</text>
    <text x="86" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Single Codebase</text>
  </g>

  <!-- Floating Badge 4: Bottom Left - 60 FPS Native Performance -->
  <g transform="translate(25, 315)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="145" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="15" fill="url(#amberGrad)"/>
    <!-- Lightning Bolt Icon -->
    <path d="M26 14 L19 25 H25 L24 34 L31 23 H25 Z" fill="#ffffff"/>
    <text x="90" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">60 FPS Native</text>
    <text x="90" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Ultra Fast Performance</text>
  </g>

  <!-- MAIN DESKTOP / WEB WINDOW MOCKUP -->
  <g transform="translate(110, 85)" filter="url(#mainShadow)">
    <!-- Window Outer Shell -->
    <rect x="0" y="0" width="350" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <path d="M 0 16 C 0 7, 7 0, 16 0 L 334 0 C 343 0, 350 7, 350 16 L 350 36 L 0 36 Z" fill="#f1f5f9"/>
    <!-- Window Control Dots -->
    <circle cx="18" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="46" cy="18" r="4.5" fill="#10b981"/>
    <!-- Address Bar / Search -->
    <rect x="75" y="10" width="180" height="16" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="165" y="22" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">https://cross-platform.app</text>

    <!-- Inner Window Body Area -->
    <rect x="12" y="46" width="326" height="212" rx="10" fill="#f8fafc"/>

    <!-- Dashboard Top Banner (Primary Gradient) -->
    <rect x="22" y="56" width="306" height="65" rx="10" fill="url(#primaryGrad)"/>
    <text x="36" y="80" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff">Cross-Platform Hub</text>
    <text x="36" y="96" font-family="sans-serif" font-size="9" fill="#e0f2fe">Deploy simultaneously to Web, iOS, Android &amp; Desktop</text>
    <rect x="240" y="73" width="76" height="26" rx="6" fill="#ffffff"/>
    <text x="278" y="89" font-family="sans-serif" font-weight="800" font-size="9" fill="#005F96" text-anchor="middle">Live Sync</text>

    <!-- Analytics / Cards Grid -->
    <g transform="translate(22, 130)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="95" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-family="sans-serif" font-weight="600" font-size="8.5" fill="#64748b">iOS Build</text>
      <text x="10" y="36" font-family="sans-serif" font-weight="900" font-size="14" fill="#005F96">v2.4.0</text>
      <circle cx="78" cy="27" r="8" fill="#dcfce7"/>
      <path d="M74 27 L77 30 L82 24" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Card 2 -->
      <rect x="105" y="0" width="95" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" font-family="sans-serif" font-weight="600" font-size="8.5" fill="#64748b">Android Build</text>
      <text x="115" y="36" font-family="sans-serif" font-weight="900" font-size="14" fill="#0284C7">v2.4.0</text>
      <circle cx="183" cy="27" r="8" fill="#dcfce7"/>
      <path d="M179 27 L182 30 L187 24" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Card 3 -->
      <rect x="210" y="0" width="96" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="220" y="18" font-family="sans-serif" font-weight="600" font-size="8.5" fill="#64748b">Web App</text>
      <text x="220" y="36" font-family="sans-serif" font-weight="900" font-size="14" fill="#10B981">100%</text>
      <circle cx="288" cy="27" r="8" fill="#dcfce7"/>
      <path d="M284 27 L287 30 L292 24" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Bottom Progress / Chart Bar -->
    <rect x="22" y="195" width="306" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="213" font-family="sans-serif" font-weight="700" font-size="9" fill="#1e293b">Unified Performance Metric</text>
    <rect x="34" y="222" font-family="sans-serif" width="280" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="34" y="222" font-family="sans-serif" width="250" height="8" rx="4" fill="url(#primaryGrad)"/>
  </g>

  <!-- OVERLAPPING SMARTPHONE DEVICE (RIGHT SIDE) -->
  <g transform="translate(325, 120)" filter="url(#mainShadow)">
    <!-- Outer Phone Frame -->
    <rect x="0" y="0" width="165" height="295" rx="28" fill="url(#darkPhoneBezel)" stroke="#334155" stroke-width="3"/>

    <!-- Inner Screen -->
    <rect x="6" y="6" width="153" height="283" rx="22" fill="#ffffff"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="55" y="12" width="55" height="10" rx="5" fill="#0f172a"/>

    <!-- Screen Header -->
    <rect x="6" y="6" width="153" height="60" rx="22" fill="url(#primaryGrad)"/>
    <text x="20" y="38" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff">Mobile App</text>
    <text x="20" y="50" font-family="sans-serif" font-weight="500" font-size="8" fill="#bae6fd">Cross-Platform UI</text>

    <!-- App Widgets Grid -->
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="63" height="42" rx="8" fill="#eff6ff"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#0284c7"/>
      <text x="8" y="34" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#1e293b">Dashboard</text>

      <rect x="73" y="0" width="63" height="42" rx="8" fill="#f0fdf4"/>
      <rect x="81" y="8" width="16" height="16" rx="4" fill="#10b981"/>
      <text x="81" y="34" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#1e293b">Analytics</text>

      <rect x="0" y="48" width="63" height="42" rx="8" fill="#faf5ff"/>
      <rect x="8" y="56" width="16" height="16" rx="4" fill="#8b5cf6"/>
      <text x="8" y="82" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#1e293b">Profile</text>

      <rect x="73" y="48" width="63" height="42" rx="8" fill="#fff7ed"/>
      <rect x="81" y="56" width="16" height="16" rx="4" fill="#f59e0b"/>
      <text x="81" y="82" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#1e293b">Settings</text>
    </g>

    <!-- Action Button inside Phone -->
    <rect x="14" y="175" width="137" height="32" rx="8" fill="url(#primaryGrad)"/>
    <text x="82" y="195" font-family="sans-serif" font-weight="800" font-size="9.5" fill="#ffffff" text-anchor="middle">Launch Native App</text>

    <!-- Bottom Bar / Home Indicator -->
    <rect x="50" y="278" width="65" height="3" rx="1.5" fill="#94a3b8"/>
  </g>
</svg>
