<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <!-- Background subtle gears -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="560" cy="180" r="45" stroke-dasharray="6 6" />
    <circle cx="560" cy="180" r="30" />
    <circle cx="160" cy="300" r="35" stroke-dasharray="5 5" />
    <circle cx="160" cy="300" r="20" />
  </g>

  <!-- Monitor Stand -->
  <path d="M 320 380 L 380 380 L 365 330 L 335 330 Z" fill="#94A3B8" />
  <rect x="300" y="380" width="100" height="10" rx="3" fill="#64748B" />

  <!-- Monitor Frame -->
  <rect x="180" y="100" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
  
  <!-- Screen Header Bar -->
  <path d="M 182 102 L 518 102 L 518 130 L 182 130 Z" fill="#0284C7" rx="8" />
  <circle cx="200" cy="116" r="4.5" fill="#EF4444" />
  <circle cx="214" cy="116" r="4.5" fill="#F59E0B" />
  <circle cx="228" cy="116" r="4.5" fill="#10B981" />

  <!-- Code Lines -->
  <rect x="200" y="145" width="80" height="8" rx="4" fill="#38BDF8" opacity="0.8" />
  <rect x="290" y="145" width="120" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="165" width="140" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="185" width="60" height="8" rx="4" fill="#38BDF8" opacity="0.8" />
  <rect x="270" y="185" width="90" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="205" width="160" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="225" width="100" height="8" rx="4" fill="#38BDF8" opacity="0.8" />
  <rect x="310" y="225" width="80" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="245" width="130" height="8" rx="4" fill="#E2E8F0" />
  <rect x="200" y="265" width="70" height="8" rx="4" fill="#E2E8F0" />

  <!-- Oval PHP Logo inside monitor -->
  <g transform="translate(390, 200)">
    <ellipse cx="45" cy="25" rx="55" ry="32" fill="#4F5D95" stroke="#384572" stroke-width="3" />
    <text x="45" y="35" text-anchor="middle" font-family="sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#FFFFFF">php</text>
  </g>

  <!-- Floating Badges -->
  <!-- 1. JS Badge (Top Left) -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#38BDF8" />
    <text x="25" y="32" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">JS</text>
  </g>

  <!-- 2. HTML Badge (Top Right) -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#38BDF8" />
    <text x="25" y="28" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">5</text>
    <text x="25" y="42" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">HTML</text>
  </g>

  <!-- 3. CSS Badge (Bottom Right) -->
  <g transform="translate(510, 270)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#38BDF8" />
    <text x="25" y="28" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">3</text>
    <text x="25" y="42" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">CSS</text>
  </g>

  <!-- 4. Git Badge (Bottom Left) -->
  <g transform="translate(180, 310)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#38BDF8" />
    <path d="M 25 12 L 25 38 M 25 25 L 35 15" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <circle cx="25" cy="12" r="4" fill="#FFFFFF" />
    <circle cx="25" cy="38" r="4" fill="#FFFFFF" />
    <circle cx="35" cy="15" r="4" fill="#FFFFFF" />
  </g>
</svg>
