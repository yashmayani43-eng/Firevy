<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <!-- TRANSPARENT BACKGROUND (No solid outer rectangle) -->

  <!-- 1. Soft Light Blue Backdrop Blob -->
  <path d="M 60 220 C 40 120, 160 50, 280 80 C 400 50, 480 150, 460 270 C 480 370, 340 420, 200 410 C 70 410, 80 320, 60 220 Z" fill="#E0F2FE" opacity="0.9" />

  <!-- 2. Right Side Background Gears -->
  <g stroke="#93C5FD" stroke-width="2" fill="none" opacity="0.8">
    <g transform="translate(480, 200)">
      <circle cx="0" cy="0" r="32" stroke-dasharray="6,4" />
      <circle cx="0" cy="0" r="18" />
    </g>
    <g transform="translate(500, 270)">
      <circle cx="0" cy="0" r="26" stroke-dasharray="5,3" />
      <circle cx="0" cy="0" r="14" />
    </g>
  </g>

  <!-- 3. Main Rear Code Window Frame -->
  <g>
    <!-- Window Outer Frame -->
    <rect x="160" y="90" width="310" height="260" rx="8" fill="#38BDF8" />
    <!-- Screen Display Area -->
    <rect x="166" y="96" width="298" height="248" rx="4" fill="#F0F9FF" />
    <!-- Window Header Bar -->
    <path d="M 166 104 C 166 99, 170 96, 175 96 L 459 96 C 464 96, 468 99, 468 104 L 468 116 L 166 116 Z" fill="#7DD3FC" />
    <circle cx="178" cy="106" r="3" fill="#FFFFFF" />
    <circle cx="188" cy="106" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="198" cy="106" r="3" fill="#FFFFFF" opacity="0.8" />

    <!-- Code lines inside main window -->
    <g fill="#93C5FD">
      <rect x="180" y="130" width="80" height="5" rx="2.5" />
      <rect x="180" y="142" width="120" height="5" rx="2.5" />
      <rect x="180" y="154" width="95" height="5" rx="2.5" />

      <rect x="180" y="170" width="110" height="4" rx="2" fill="#BAE6FD" />
      <rect x="190" y="180" width="85" height="4" rx="2" fill="#BAE6FD" />
      <rect x="190" y="190" width="70" height="4" rx="2" fill="#BAE6FD" />
      <rect x="180" y="200" width="90" height="4" rx="2" fill="#BAE6FD" />

      <rect x="180" y="215" width="105" height="4" rx="2" fill="#BAE6FD" />
      <rect x="180" y="225" width="60" height="4" rx="2" fill="#BAE6FD" />
      <rect x="180" y="235" width="115" height="4" rx="2" fill="#BAE6FD" />
    </g>

    <!-- Cloud with Lock Icon in Top Center of Window -->
    <g transform="translate(300, 130)">
      <path d="M 12 18 C 8 18 4 22 4 26 C 4 30 8 34 12 34 L 36 34 C 40 34 44 30 44 26 C 44 22 40 18 36 18 C 35 12 28 8 22 10 C 18 6 12 10 12 18 Z" fill="#BAE6FD" />
      <rect x="20" y="22" width="8" height="7" rx="1.5" fill="#0284C7" />
      <path d="M 22 22 L 22 19 C 22 17.5, 26 17.5, 26 19 L 26 22" stroke="#0284C7" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- 4. Floating Brackets Badge `< />` -->
  <g transform="translate(365, 140)">
    <circle cx="26" cy="26" r="26" fill="#0284C7" />
    <text x="26" y="34" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- 5. Dark Blue Oval .NET Core Badge -->
  <g transform="translate(420, 100)">
    <circle cx="32" cy="32" r="32" fill="#1E293B" />
    <text x="32" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">.NET</text>
    <text x="32" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="9" fill="#38BDF8" text-anchor="middle">Core</text>
  </g>

  <!-- 6. Foreground Left Code Window -->
  <g transform="translate(105, 200)">
    <rect x="0" y="0" width="180" height="150" rx="6" fill="#0284C7" />
    <rect x="4" y="4" width="172" height="142" rx="3" fill="#E0F2FE" />
    <path d="M 4 10 C 4 6, 7 4, 11 4 L 169 4 C 173 4, 176 6, 176 10 L 176 20 L 4 20 Z" fill="#38BDF8" />
    <circle cx="12" cy="12" r="2.5" fill="#FFFFFF" />
    <circle cx="20" cy="12" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="28" cy="12" r="2.5" fill="#FFFFFF" opacity="0.8" />

    <!-- Code lines inside small window -->
    <g fill="#0284C7" opacity="0.7">
      <rect x="14" y="30" width="55" height="3" rx="1.5" />
      <rect x="14" y="38" width="90" height="3" rx="1.5" />
      <rect x="20" y="46" width="70" height="3" rx="1.5" />
      <rect x="20" y="54" width="50" height="3" rx="1.5" />
      <rect x="14" y="62" width="80" height="3" rx="1.5" />
      <rect x="14" y="70" width="40" height="3" rx="1.5" />
      <rect x="20" y="78" width="65" height="3" rx="1.5" />
      <rect x="14" y="86" width="75" height="3" rx="1.5" />
      <rect x="14" y="94" width="50" height="3" rx="1.5" />
      <rect x="14" y="102" width="85" height="3" rx="1.5" />
      <rect x="14" y="110" width="60" height="3" rx="1.5" />
    </g>
  </g>

  <!-- 7. Seated Developer & Desk -->
  <g id="seated-developer">
    <!-- Desk Legs & Top -->
    <rect x="180" y="300" width="220" height="12" rx="3" fill="#0284C7" />
    <path d="M 195 312 L 180 395 L 195 395 L 206 312 Z" fill="#0369A1" />
    <path d="M 385 312 L 370 395 L 385 395 L 396 312 Z" fill="#0369A1" />
    <!-- Office Chair -->
    <rect x="220" y="260" width="38" height="50" rx="6" fill="#1E293B" />
    <rect x="215" y="310" width="48" height="10" rx="3" fill="#0F172A" />
    <path d="M 239 320 L 239 375 L 220 390 L 258 390 Z" fill="#0F172A" />

    <!-- Seated Developer Torso & Head -->
    <path d="M 230 250 L 270 250 L 285 310 L 225 310 Z" fill="#0284C7" />
    <!-- Legs -->
    <path d="M 240 310 L 245 385 L 265 385 L 260 310 Z" fill="#0F172A" />
    <path d="M 265 310 L 285 385 L 305 385 L 280 310 Z" fill="#0F172A" />
    <!-- Head & Hair -->
    <circle cx="250" cy="232" r="13" fill="#F59E0B" />
    <path d="M 238 230 C 238 215 262 215 262 230 C 255 225 245 225 238 230 Z" fill="#0F172A" />
    <!-- Hands & Laptop on Desk -->
    <path d="M 280 275 L 305 285 L 295 295 L 270 285 Z" fill="#0284C7" />
    <polygon points="300,298 335,298 330,280 305,280" fill="#475569" />
    <polygon points="330,280 345,260 340,260 325,280" fill="#64748B" />
  </g>

  <!-- 8. Standing Developer on Right -->
  <g id="standing-developer">
    <!-- Legs -->
    <path d="M 390 280 L 395 395 L 412 395 L 410 300 L 428 395 L 445 395 L 422 280 Z" fill="#0F172A" />
    <!-- Suit Jacket & Torso -->
    <path d="M 385 220 L 430 220 L 422 285 L 388 285 Z" fill="#0284C7" />
    <path d="M 400 220 L 415 220 L 412 285 L 403 285 Z" fill="#FFFFFF" />
    <path d="M 378 220 L 392 220 L 388 285 L 378 285 Z" fill="#1E3A8A" />
    <path d="M 425 220 L 438 220 L 432 285 L 422 285 Z" fill="#1E3A8A" />

    <!-- Head & Hair -->
    <circle cx="408" cy="198" r="14" fill="#F59E0B" />
    <path d="M 394 195 C 394 178 422 178 422 195 C 414 190 402 190 394 195 Z" fill="#0F172A" />

    <!-- Arms holding Laptop -->
    <path d="M 382 225 L 360 250 L 375 258 L 392 232 Z" fill="#1E3A8A" />
    <polygon points="350,250 388,250 382,238 346,238" fill="#64748B" />
    <polygon points="346,238 335,218 342,218 352,238" fill="#94A3B8" />
  </g>

  <!-- Baseline Floor -->
  <line x1="70" y1="395" x2="520" y2="395" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
</svg>
