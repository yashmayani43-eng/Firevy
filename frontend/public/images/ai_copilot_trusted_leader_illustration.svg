<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Soft Background Glow Circle -->
  <circle cx="300" cy="225" r="190" fill="#EAF4FB" opacity="0.7"/>

  <!-- Laptop Stand / Base -->
  <path d="M 60 360 L 460 360 C 475 360 485 372 480 382 L 40 382 C 35 372 45 360 60 360 Z" fill="#005F96"/>
  <polygon points="210,360 310,360 300,368 220,368" fill="#38BDF8"/>

  <!-- Laptop Main Display Frame -->
  <rect x="90" y="100" width="340" height="260" rx="16" fill="#0F2942" stroke="#005F96" stroke-width="4"/>
  <rect x="102" y="112" width="316" height="236" rx="8" fill="#FFFFFF"/>

  <!-- Display Content: User Profiles & Web Interface -->
  <!-- Top Navigation Header -->
  <rect x="114" y="122" width="292" height="22" rx="4" fill="#F1F5F9"/>
  <circle cx="126" cy="133" r="3.5" fill="#EF4444"/>
  <circle cx="138" cy="133" r="3.5" fill="#F59E0B"/>
  <circle cx="150" cy="133" r="3.5" fill="#10B981"/>

  <!-- User Profile Card 1 (Left) -->
  <rect x="114" y="152" width="138" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- User Avatar Circle -->
  <circle cx="150" cy="190" r="22" fill="#BAE6FD"/>
  <circle cx="150" cy="182" r="8" fill="#0284C7"/>
  <path d="M 136 204 C 136 195 164 195 164 204 Z" fill="#0284C7"/>
  <!-- Lines next to avatar -->
  <rect x="182" y="176" width="60" height="8" rx="2" fill="#005F96"/>
  <rect x="182" y="190" width="45" height="6" rx="2" fill="#94A3B8"/>
  <rect x="182" y="202" width="55" height="6" rx="2" fill="#CBD5E1"/>
  <!-- Bottom card details -->
  <rect x="124" y="222" width="118" height="6" rx="2" fill="#E2E8F0"/>
  <rect x="124" y="234" width="90" height="6" rx="2" fill="#E2E8F0"/>

  <!-- User Profile Card 2 (Right) -->
  <rect x="260" y="152" width="146" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Image Thumbnail Box -->
  <rect x="270" y="162" width="126" height="56" rx="6" fill="#0082C8"/>
  <path d="M 285 208 L 305 185 L 325 208 M 315 198 L 335 178 L 375 208" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <circle cx="360" cy="178" r="6" fill="#FDE047"/>
  <!-- Lines below image -->
  <rect x="270" y="226" width="110" height="6" rx="2" fill="#64748B"/>
  <rect x="270" y="238" width="85" height="6" rx="2" fill="#CBD5E1"/>

  <!-- Bottom Action Bar / User Profile Footer -->
  <rect x="114" y="270" width="292" height="68" rx="8" fill="#005F96"/>
  <circle cx="140" cy="304" r="14" fill="#FFFFFF"/>
  <circle cx="140" cy="300" r="5" fill="#005F96"/>
  <path d="M 130 312 C 130 307 150 307 150 312 Z" fill="#005F96"/>
  <rect x="166" y="292" width="140" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="166" y="306" width="100" height="6" rx="2" fill="#BAE6FD"/>
  <rect x="330" y="294" width="64" height="20" rx="4" fill="#38BDF8"/>

  <!-- Robot AI Assistant Standing on Right -->
  <g transform="translate(420, 110)">
    <!-- Antenna -->
    <line x1="60" y1="20" x2="60" y2="40" stroke="#005F96" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="16" r="8" fill="#38BDF8"/>

    <!-- Head -->
    <rect x="20" y="40" width="80" height="60" rx="20" fill="#005F96" stroke="#0082C8" stroke-width="3"/>
    <!-- Face Screen -->
    <rect x="30" y="50" width="60" height="40" rx="12" fill="#0F2942"/>
    <!-- Glowing Robot Eyes -->
    <ellipse cx="48" cy="70" rx="7" ry="9" fill="#38BDF8"/>
    <ellipse cx="72" cy="70" rx="7" ry="9" fill="#38BDF8"/>
    <circle cx="50" cy="68" r="2.5" fill="#FFFFFF"/>
    <circle cx="74" cy="68" r="2.5" fill="#FFFFFF"/>
    <!-- Smile Arc -->
    <path d="M 52 80 Q 60 86 68 80" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="48" y="100" width="24" height="12" rx="4" fill="#38BDF8"/>

    <!-- Body / Torso -->
    <rect x="15" y="112" width="90" height="100" rx="24" fill="#005F96" stroke="#0082C8" stroke-width="3"/>
    <!-- Chest Core AI Symbol -->
    <circle cx="60" cy="155" r="18" fill="#0F2942"/>
    <circle cx="60" cy="155" r="12" fill="#38BDF8"/>
    <path d="M 54 155 L 66 155 M 60 149 L 60 161" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Arm holding wrench -->
    <path d="M 20 130 C -15 150 -10 200 -30 190" stroke="#005F96" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Wrench Tool -->
    <g transform="translate(-45, 175) rotate(-30)">
      <rect x="0" y="0" width="10" height="35" rx="3" fill="#64748B"/>
      <circle cx="5" cy="0" r="10" fill="#475569"/>
      <rect x="2" y="-6" width="6" height="8" fill="#F8FAFC"/>
    </g>

    <!-- Right Arm pointing towards screen -->
    <path d="M 100 130 C 125 150 110 180 90 190" stroke="#005F96" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Robot Legs -->
    <rect x="30" y="212" width="22" height="40" rx="10" fill="#005F96"/>
    <rect x="68" y="212" width="22" height="40" rx="10" fill="#005F96"/>
    <!-- Feet -->
    <rect x="22" y="246" width="32" height="14" rx="7" fill="#0F2942"/>
    <rect x="64" y="246" width="32" height="14" rx="7" fill="#0F2942"/>
  </g>
</svg>
