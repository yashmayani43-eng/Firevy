<svg width="650" height="480" viewBox="0 0 650 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCircleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="primaryBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#005F96"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#005F96"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowLight" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#005F96" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- BACKGROUND GRAPHIC ELEMENTS (Light Blue Circles & Rings) -->
  <!-- Top Left Donut Accent -->
  <path d="M 80 80 A 45 45 0 1 1 120 120 L 105 105 A 25 25 0 1 0 80 80 Z" fill="#7DD3FC" opacity="0.75"/>
  <circle cx="95" cy="95" r="45" stroke="#BAE6FD" stroke-width="12" fill="none" opacity="0.6"/>

  <!-- Large Right Background Soft Circle -->
  <circle cx="580" cy="220" r="60" fill="#E0F2FE" opacity="0.7"/>
  <circle cx="580" cy="220" r="40" fill="none" stroke="#BAE6FD" stroke-width="10"/>

  <!-- Center-Left Background Soft Light Blue Circle -->
  <circle cx="280" cy="210" r="140" fill="url(#bgCircleGrad)"/>

  <!-- Floating Analytics Donut / Pie Chart (Top Left behind cards) -->
  <g filter="url(#shadowLight)" opacity="0.95">
    <!-- Donut Segment 1 (Blue) -->
    <path d="M 120 160 A 55 55 0 0 1 175 105 L 175 125 A 35 35 0 0 0 140 160 Z" fill="#005F96"/>
    <!-- Donut Segment 2 (Cyan) -->
    <path d="M 175 105 A 55 55 0 1 1 120 160 L 140 160 A 35 35 0 1 0 175 125 Z" fill="#38BDF8"/>
  </g>

  <!-- BACKBOARD / FLOATING DASHBOARD CARDS -->
  
  <!-- Left Dashboard Card (Line Chart + Mini Bar) -->
  <g filter="url(#shadowCard)">
    <rect x="230" y="85" width="210" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Card Header dots -->
    <circle cx="248" cy="100" r="3.5" fill="#94A3B8"/>
    <circle cx="258" cy="100" r="3.5" fill="#CBD5E1"/>
    <circle cx="268" cy="100" r="3.5" fill="#E2E8F0"/>
    <line x1="242" y1="112" x2="422" y2="112" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Mini Line Graph inside Left Card -->
    <path d="M 248 150 Q 280 130 310 145 T 370 125 T 415 135" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="310" cy="145" r="4" fill="#005F96"/>
    <circle cx="370" cy="125" r="4" fill="#38BDF8"/>

    <!-- Bar Chart in bottom part of Left Card -->
    <rect x="250" y="165" width="10" height="40" rx="2" fill="#BAE6FD"/>
    <rect x="265" y="155" width="10" height="50" rx="2" fill="#38BDF8"/>
    <rect x="280" y="172" width="10" height="33" rx="2" fill="#BAE6FD"/>
    <rect x="295" y="145" width="10" height="60" rx="2" fill="#005F96"/>
    <rect x="310" y="160" width="10" height="45" rx="2" fill="#0284C7"/>
    <rect x="325" y="170" width="10" height="35" rx="2" fill="#BAE6FD"/>
  </g>

  <!-- Right Dashboard Card (Large Analytics Panel with Bar & Trend) -->
  <g filter="url(#shadowCard)">
    <rect x="455" y="90" width="170" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="455" y="90" width="170" height="26" rx="8" fill="#FFFFFF"/>
    <line x1="455" y1="116" x2="625" y2="116" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Header title representation lines -->
    <rect x="468" y="100" width="60" height="6" rx="3" fill="#64748B"/>

    <!-- Main Chart inside Right Card -->
    <!-- Grid Lines -->
    <line x1="470" y1="135" x2="610" y2="135" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="470" y1="160" x2="610" y2="160" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="470" y1="185" x2="610" y2="185" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="470" y1="210" x2="610" y2="210" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Line Area Trend -->
    <path d="M 475 195 L 505 170 L 535 180 L 565 140 L 595 150 L 595 210 L 475 210 Z" fill="url(#bgCircleGrad)" opacity="0.6"/>
    <path d="M 475 195 L 505 170 L 535 180 L 565 140 L 595 150" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini indicator dots -->
    <circle cx="565" cy="140" r="3.5" fill="#005F96"/>
  </g>

  <!-- POTTED PLANT ON THE LEFT -->
  <g id="potted-plant">
    <!-- Leaves -->
    <path d="M 330 330 Q 300 290 320 250 Q 340 280 335 330 Z" fill="#0284C7"/>
    <path d="M 335 330 Q 360 280 345 235 Q 330 270 335 330 Z" fill="#0369A1"/>
    <path d="M 325 340 Q 290 320 285 285 Q 315 305 325 340 Z" fill="#38BDF8"/>
    <path d="M 335 340 Q 370 330 380 295 Q 350 315 335 340 Z" fill="#005F96"/>
    <!-- Pot -->
    <path d="M 315 340 L 345 340 L 340 400 L 320 400 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="312" y="337" width="36" height="8" rx="2" fill="#94A3B8"/>
  </g>

  <!-- DESK & FILE CABINET -->
  
  <!-- Desk Surface & Legs -->
  <g id="desk-and-chair">
    <!-- Desk Shadow -->
    <ellipse cx="430" cy="425" rx="140" ry="12" fill="#E2E8F0" opacity="0.8"/>

    <!-- Drawer Cabinet (Right under/beside desk) -->
    <rect x="525" y="305" width="55" height="110" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Cabinet Drawers -->
    <rect x="532" y="315" width="41" height="26" rx="2" fill="#BAE6FD" opacity="0.6"/>
    <rect x="547" y="325" width="11" height="4" rx="2" fill="#0284C7"/>

    <rect x="532" y="347" width="41" height="26" rx="2" fill="#BAE6FD" opacity="0.6"/>
    <rect x="547" y="357" width="11" height="4" rx="2" fill="#0284C7"/>

    <rect x="532" y="379" width="41" height="26" rx="2" fill="#BAE6FD" opacity="0.6"/>
    <rect x="547" y="389" width="11" height="4" rx="2" fill="#0284C7"/>

    <!-- Desk Tabletop -->
    <rect x="350" y="315" width="225" height="12" rx="3" fill="#1E293B"/>
    <!-- Desk Legs -->
    <rect x="365" y="327" width="8" height="90" fill="#334155"/>
    <rect x="515" y="327" width="8" height="90" fill="#334155"/>
    <line x1="365" y1="415" x2="523" y2="415" stroke="#475569" stroke-width="4"/>

    <!-- Chair (Office swivel chair) -->
    <!-- Backrest -->
    <rect x="370" y="270" width="35" height="65" rx="6" fill="#005F96"/>
    <!-- Seat -->
    <rect x="365" y="330" width="50" height="12" rx="4" fill="#005F96"/>
    <!-- Stand -->
    <rect x="387" y="342" width="6" height="45" fill="#334155"/>
    <!-- Base / Wheels -->
    <path d="M 365 392 L 415 392 M 375 392 L 365 402 M 405 392 L 415 402" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- PERSON SITTING AT DESK (MAN / ANALYST) -->
  <g id="seated-analyst">
    <!-- Legs -->
    <path d="M 385 330 L 390 380 L 435 380" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <ellipse cx="440" cy="380" rx="10" ry="5" fill="#0F172A"/>

    <!-- Torso / Shirt -->
    <path d="M 380 270 C 380 250 415 250 420 270 L 425 325 L 375 325 Z" fill="#005F96"/>
    <path d="M 398 255 L 402 255 L 402 280 L 398 280 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- Head & Hair -->
    <circle cx="400" cy="235" r="16" fill="#FDBA74"/>
    <!-- Hair (Dark Blue / Black vector cut) -->
    <path d="M 384 235 C 384 218 416 218 416 235 C 412 225 404 220 396 222 C 390 224 386 228 384 235 Z" fill="#0F172A"/>

    <!-- Arms & Hands typing on Laptop -->
    <path d="M 405 270 L 430 300 L 450 298" fill="none" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 400 270 L 420 302 L 448 300" fill="none" stroke="#005F96" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- LAPTOP ON DESK -->
    <g id="laptop">
      <!-- Laptop Screen -->
      <polygon points="445,312 485,312 482,275 448,275" fill="#0F172A"/>
      <polygon points="448,310 482,310 480,278 450,278" fill="#38BDF8"/>
      <!-- Screen Graphic -->
      <line x1="454" y1="290" x2="476" y2="290" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="454" y1="298" x2="470" y2="298" stroke="#BAE6FD" stroke-width="2"/>
      <!-- Laptop Base -->
      <rect x="440" y="312" width="50" height="4" rx="2" fill="#94A3B8"/>
    </g>
  </g>

  <!-- PERSON STANDING ON RIGHT (WOMAN / ANALYST OBSERVER) -->
  <g id="standing-analyst">
    <!-- Shadow -->
    <ellipse cx="510" cy="425" rx="25" ry="6" fill="#E2E8F0" opacity="0.8"/>

    <!-- Legs -->
    <line x1="502" y1="340" x2="502" y2="420" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
    <line x1="518" y1="340" x2="518" y2="420" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="500" cy="422" rx="7" ry="4" fill="#0F172A"/>
    <ellipse cx="520" cy="422" rx="7" ry="4" fill="#0F172A"/>

    <!-- Torso / Top -->
    <path d="M 490 275 C 490 260 530 260 530 275 L 525 342 L 495 342 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Head & Hair -->
    <circle cx="510" cy="245" r="14" fill="#FDBA74"/>
    <!-- Ponytail / Hair -->
    <path d="M 496 245 C 496 230 524 230 524 245 C 524 255 528 265 532 270 C 524 265 522 255 524 245 Z" fill="#0F172A"/>

    <!-- Arm thinking (Hand on chin) -->
    <path d="M 522 280 L 532 305 L 514 256" fill="none" stroke="#FDBA74" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arm rest on side -->
    <path d="M 495 280 L 490 310 L 495 330" fill="none" stroke="#FDBA74" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>
