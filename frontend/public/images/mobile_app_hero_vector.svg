<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <!-- Filters for Depth -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#005F96" flood-opacity="0.18"/>
    </filter>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="screenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005F96"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- NO CONTAINER BOX - 100% TRANSPARENT BACKGROUND CANVAS -->

  <!-- Floating Badge 1: Top Left - Code Badge -->
  <g transform="translate(40, 50)" filter="url(#elementShadow)">
    <rect x="0" y="0" width="110" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="8" y="7" width="28" height="28" rx="8" fill="#005F96"/>
    <text x="22" y="26" font-family="monospace" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <text x="70" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#1e293b" text-anchor="middle">iOS &amp; Android</text>
  </g>

  <!-- Floating Badge 2: Top Right - Rating / Downloads -->
  <g transform="translate(430, 45)" filter="url(#elementShadow)">
    <rect x="0" y="0" width="130" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="14" fill="#f59e0b"/>
    <path d="M23 13 L26 19 L33 20 L28 25 L29 32 L23 28 L17 32 L18 25 L13 20 L20 19 Z" fill="#ffffff"/>
    <text x="78" y="22" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">4.9 ★★★★★</text>
    <text x="78" y="36" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Top Rated Apps</text>
  </g>

  <!-- Floating Badge 3: Middle Right - Performance -->
  <g transform="translate(445, 230)" filter="url(#elementShadow)">
    <rect x="0" y="0" width="125" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="30" height="30" rx="8" fill="#10b981"/>
    <path d="M19 24 L23 28 L31 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="24" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">100% Native</text>
    <text x="82" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">60 FPS Speed</text>
  </g>

  <!-- Floating Badge 4: Bottom Left - AI Mobile App -->
  <g transform="translate(30, 310)" filter="url(#elementShadow)">
    <rect x="0" y="0" width="135" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="10" y="9" width="30" height="30" rx="8" fill="url(#cardGrad2)"/>
    <circle cx="25" cy="24" r="6" fill="#ffffff"/>
    <text x="85" y="24" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">AI Powered</text>
    <text x="85" y="37" font-family="sans-serif" font-weight="500" font-size="10" fill="#64748b">Smart Solutions</text>
  </g>

  <!-- CENTER SMARTPHONE MOCKUP -->
  <g transform="translate(190, 20)" filter="url(#heroShadow)">
    <!-- Outer Phone Body -->
    <rect x="0" y="0" width="220" height="420" rx="36" fill="url(#phoneBody)" stroke="#334155" stroke-width="4"/>

    <!-- Inner Screen Frame -->
    <rect x="8" y="8" width="204" height="404" rx="28" fill="#f8fafc"/>

    <!-- Dynamic Island / Notch -->
    <rect x="75" y="16" width="70" height="14" rx="7" fill="#0f172a"/>
    <circle cx="132" cy="23" r="3" fill="#1e293b"/>

    <!-- Screen App UI Content -->
    <!-- App Header Banner -->
    <rect x="8" y="8" width="204" height="100" rx="28" fill="url(#screenHeader)"/>
    <!-- Speaker/Camera cutout padding offset -->
    <text x="24" y="54" font-family="sans-serif" font-weight="800" font-size="14" fill="#ffffff">Firevy Mobile</text>
    <text x="24" y="70" font-family="sans-serif" font-weight="500" font-size="10" fill="#bae6fd">Next-Gen App Experience</text>

    <!-- Profile Circle in Header -->
    <circle cx="180" cy="58" r="16" fill="#ffffff" opacity="0.2"/>
    <circle cx="180" cy="58" r="12" fill="#ffffff"/>

    <!-- App Search Bar -->
    <rect x="20" y="88" width="180" height="28" rx="8" fill="#ffffff" filter="url(#elementShadow)"/>
    <circle cx="34" cy="102" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="38" y1="106" x2="42" y2="110" stroke="#94a3b8" stroke-width="2"/>
    <text x="50" y="106" font-family="sans-serif" font-size="9" fill="#94a3b8">Search features...</text>

    <!-- UI Card 1: Stats Widget -->
    <rect x="20" y="128" width="180" height="75" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="146" font-family="sans-serif" font-weight="700" font-size="11" fill="#1e293b">Total Active Users</text>
    <text x="32" y="166" font-family="sans-serif" font-weight="900" font-size="18" fill="#005F96">248.5K</text>
    <!-- Mini Bar Chart -->
    <rect x="125" y="165" width="8" height="20" rx="2" fill="#e2e8f0"/>
    <rect x="137" y="155" width="8" height="30" rx="2" fill="#93c5fd"/>
    <rect x="149" y="145" width="8" height="40" rx="2" fill="#3b82f6"/>
    <rect x="161" y="138" width="8" height="47" rx="2" fill="#005F96"/>
    <rect x="173" y="150" width="8" height="35" rx="2" fill="#06b6d4"/>

    <!-- UI Card 2: Feature Row Gradient -->
    <rect x="20" y="213" width="180" height="60" rx="12" fill="url(#cardGrad1)"/>
    <text x="34" y="238" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff">Cloud Sync Active</text>
    <text x="34" y="253" font-family="sans-serif" font-weight="500" font-size="10" fill="#e0f2fe">Real-time database updates</text>
    <circle cx="176" cy="243" r="12" fill="#ffffff" opacity="0.25"/>
    <path d="M172 243 L175 246 L181 240" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- UI Card 3: Action Buttons Grid -->
    <rect x="20" y="283" width="84" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="62" cy="303" r="10" fill="#eff6ff"/>
    <path d="M58 303 L66 303 M62 299 L62 307" stroke="#005F96" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="328" font-family="sans-serif" font-weight="600" font-size="9" fill="#475569" text-anchor="middle">Add New</text>

    <rect x="116" y="283" width="84" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="158" cy="303" r="10" fill="#f0fdf4"/>
    <path d="M152 303 L157 307 L165 299" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="158" y="328" font-family="sans-serif" font-weight="600" font-size="9" fill="#475569" text-anchor="middle">Analytics</text>

    <!-- Bottom Action Button in Phone -->
    <rect x="20" y="353" width="180" height="38" rx="10" fill="url(#accentBtn)"/>
    <text x="110" y="377" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Launch Mobile App →</text>
  </g>
</svg>
