<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Soft Background Glow -->
  <circle cx="300" cy="225" r="180" fill="#EBF5FB" opacity="0.6"/>
  
  <!-- Floating Top AI Badge -->
  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="70" height="40" rx="8" fill="#005F96"/>
    <text x="35" y="25" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="1">AI</text>

    <!-- Top little tabs -->
    <rect x="48" y="-4" width="14" height="4" rx="1" fill="#0082C8"/>
    <rect x="54" y="-4" width="3" height="4" fill="#FFFFFF"/>
    <rect x="60" y="-4" width="3" height="4" fill="#FFFFFF"/>
  </g>

  <!-- Laptop Base Screen Container -->
  <!-- Laptop Base / Hinge -->
  <path d="M 100 380 L 500 380 C 515 380 525 390 520 400 L 80 400 C 75 390 85 380 100 380 Z" fill="#0F2942"/>
  <polygon points="250,380 350,380 340,388 260,388" fill="#3A5A78"/>

  <!-- Laptop Frame / Bezel -->
  <rect x="130" y="100" width="340" height="280" rx="16" fill="#1E3A5F" stroke="#0D233A" stroke-width="4"/>
  
  <!-- Screen Inner Display -->
  <rect x="142" y="112" width="316" height="256" rx="10" fill="#0D233A"/>
  <rect x="146" y="116" width="308" height="248" rx="8" fill="#FFFFFF"/>

  <!-- Screen Content UI Layout -->
  <!-- Header Bar -->
  <rect x="156" y="126" width="288" height="24" rx="4" fill="#F0F4F8"/>
  <circle cx="170" cy="138" r="4" fill="#FF5F56"/>
  <circle cx="184" cy="138" r="4" fill="#FFBD2E"/>
  <circle cx="198" cy="138" r="4" fill="#27C93F"/>
  <rect x="220" y="132" width="140" height="12" rx="3" fill="#E2E8F0"/>

  <!-- Left Sidebar Panel -->
  <rect x="156" y="158" width="70" height="196" rx="4" fill="#F8FAFC"/>
  <rect x="164" y="168" width="54" height="8" rx="2" fill="#005F96"/>
  <rect x="164" y="184" width="44" height="6" rx="2" fill="#CBD5E1"/>
  <rect x="164" y="198" width="50" height="6" rx="2" fill="#CBD5E1"/>
  <rect x="164" y="212" width="38" height="6" rx="2" fill="#CBD5E1"/>
  <rect x="164" y="226" width="48" height="6" rx="2" fill="#CBD5E1"/>

  <!-- Main Content Grid -->
  <rect x="236" y="158" width="208" height="70" rx="6" fill="#F1F5F9"/>
  <rect x="248" y="170" width="120" height="10" rx="3" fill="#005F96"/>
  <rect x="248" y="188" width="180" height="6" rx="2" fill="#94A3B8"/>
  <rect x="248" y="200" width="150" height="6" rx="2" fill="#CBD5E1"/>
  <rect x="248" y="212" width="110" height="6" rx="2" fill="#CBD5E1"/>

  <!-- Code / Chat Copilot Cards Bottom Grid -->
  <rect x="236" y="236" width="100" height="118" rx="6" fill="#E2E8F0"/>
  <rect x="244" y="246" width="84" height="8" rx="2" fill="#0082C8"/>
  <rect x="244" y="262" width="70" height="6" rx="2" fill="#64748B"/>
  <rect x="244" y="274" width="60" height="6" rx="2" fill="#94A3B8"/>
  <rect x="244" y="286" width="76" height="6" rx="2" fill="#CBD5E1"/>
  <rect x="244" y="310" width="50" height="14" rx="3" fill="#005F96"/>

  <rect x="344" y="236" width="100" height="118" rx="6" fill="#005F96"/>
  <rect x="352" y="246" width="84" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="352" y="262" width="70" height="6" rx="2" fill="#93C5FD"/>
  <rect x="352" y="274" width="60" height="6" rx="2" fill="#BAE6FD"/>
  <rect x="352" y="286" width="76" height="6" rx="2" fill="#E0F2FE"/>
  <rect x="352" y="310" width="50" height="14" rx="3" fill="#FFFFFF"/>

  <!-- Floating UI Window 1 (Left Popout) -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="130" height="100" rx="8" fill="#FFFFFF" stroke="#0082C8" stroke-width="2" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))"/>
    <rect x="0" y="0" width="130" height="20" rx="8" fill="#0082C8"/>
    <circle cx="10" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="20" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="30" cy="10" r="3" fill="#FFFFFF"/>

    <rect x="12" y="32" width="80" height="8" rx="2" fill="#005F96"/>
    <rect x="12" y="48" width="106" height="5" rx="2" fill="#94A3B8"/>
    <rect x="12" y="58" width="90" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="12" y="68" width="70" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="12" y="80" width="40" height="10" rx="2" fill="#0082C8"/>
  </g>

  <!-- Floating UI Window 2 (Right Popout) -->
  <g transform="translate(420, 180)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#005F96" stroke-width="2" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))"/>
    <rect x="0" y="0" width="120" height="18" rx="8" fill="#005F96"/>
    <rect x="10" y="28" width="70" height="7" rx="2" fill="#0082C8"/>
    <rect x="10" y="42" width="100" height="5" rx="2" fill="#94A3B8"/>
    <rect x="10" y="52" width="80" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="10" y="68" width="35" height="10" rx="2" fill="#005F96"/>
